l_english:
 # Body names for the home systems in
 # src/common/solar_system_initializers/stg_home_systems.txt.
 #
 # Only names that need a KEY are here. STNH writes most of its planet names as
 # bare literals ("Keid", "T'Khut", "Praxis") and the engine displays a literal
 # unchanged when no key matches, so converting those to keys would be work with
 # no effect. Two classes do need one:
 #
 #  1. NAME_* keys STNH's initializers reference. STNH's localisation is NOT
 #     vendored (its include: list is art only), so these three would have shown
 #     as raw keys on the map. Values copied from STNH's own english loc.
 #  2. STG_N_* for the nine home systems tools/gen_home_systems.py authors
 #     itself, because STNH's versions of those are procedural — see
 #     .docs/decisions/25-real-home-systems.md.

 NAME_Vulcan:0 "Vulcan"
 NAME_Unicomplex_Section_Alpha:0 "Unicomplex 01 Hub"
 NAME_Unicomplex_Section_Beta:0 "Unicomplex 02 Hub"

 # Ferenginar — Ferengi Alliance
 STG_N_FerengiI:0 "Ferenginar I"
 STG_N_FerengiII:0 "Ferenginar II"
 STG_N_Gorlack:0 "Gorlack"
 STG_N_Clarus:0 "Clarus"

 # Trillius — Trill Symbiosis
