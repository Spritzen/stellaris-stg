 STG_N_TrilliusII:0 "Trillius II"
 STG_N_Mak_ala:0 "Mak'ala"
 STG_N_TrilliusVI:0 "Trillius VI"

 # Bolarus — Bolian Union. Bolarus IX is the ninth planet, so the eight ahead
 # of it are named rather than invented away.
 STG_N_BolarusI:0 "Bolarus I"
