l_english:
 # Star Trek Galaxies -- every proper noun used by the name lists in
 # src/common/name_lists/.
 #
 # EVERY NAME IS A KEY. Stellaris looks a name token up as a localisation key
 # always -- there is no literal mode -- so a bare token logs `Failed to
 # localize leader name with key <Name>` each time it is drawn. Vanilla routes
 # all of its names through keys for the same reason.
 #
 # ONE FLAT STG_N_ NAMESPACE, not vanilla's per-list _CHR_ / _SHIP_ / _PLANET_
 # split, so a noun used in more than one place (Vulcan the planet and the
 # homeworld, Enterprise the ship) is spelled once. Key form: STG_N_ + the name
 # with spaces and apostrophes removed, hyphens kept.
 #
 # This file and src/common/name_lists/ move together; `make validate` checks
 # that every name-list token resolves to a key here.
 #
 # These were converted from bare tokens that spelled a space and an apostrophe
 # identically ("_"). Read as APOSTROPHES:
 #   Aj'Rmr  Ba'el  Bok'Nor  Chin'toka  Hegh'ta  Ja'rod  Ning'tao  Nu'Daq
 #   Qu'Vat  Toh'Kaht  Ya'Vang
 # Every other "_" was read as a space. Aj'Rmr and Kel Provek are the least
 # certain -- correcting them here reaches every list at once.
 STG_ANDORIAN_ADEPTGUARD:0 "$ORD$ Adept Guard"
 STG_ANDORIAN_ASSAULTGUARD:0 "$ORD$ Assault Guard"
 STG_ANDORIAN_AUGMENTEDGUARD:0 "$ORD$ Augmented Guard"
 STG_ANDORIAN_AUTOMATEDDEFENSEGUARD:0 "$ORD$ Automated Defense Guard"
