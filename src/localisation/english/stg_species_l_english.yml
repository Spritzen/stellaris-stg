l_english:
 # Star Trek Galaxies — species classes, their name lists, and the empire
 # designer's portrait category.
 #
 # The species class key families mirror vanilla's HUM block in
 # /stellaris/localisation/english/name_lists/name_lists_l_english.yml. Events,
 # anomalies and diplomacy pull the anatomy and insult keys by name, so a class
 # that defines only its title shows raw keys the first time an alien insults it.
 #
 # THE FAMILY KEYS CARRY NO `STG_` PREFIX, and cannot. The engine derives every
 # one of them from the class key itself — FED_desc, FED_organ — exactly as
 # vanilla does for HUM and STNH does for BAJ. This is convention exception 2 in
 # .docs/guides/writing-script.md, for the same reason as the class keys in
 # src/common/species_classes/stg_species_classes.txt: the name is not ours to
 # choose. See .docs/decisions/21-species-class-localisation.md.

 # ── empire designer ──
 STG_PORTRAIT_CATEGORY_TREK:0 "Alpha Quadrant"

