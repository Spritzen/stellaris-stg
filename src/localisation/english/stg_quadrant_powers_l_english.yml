l_english:
 # Star Trek Galaxies — the nine powers of src/prescripted_countries/stg_quadrant_powers.txt.
 #
 # Ship prefixes: Star Trek gives registry prefixes only to Starfleet and to the
 # Klingon and Romulan fleets, so the seven below are constructed on the same
 # pattern (Imperial Guard Vessel, Bajoran Space Vessel, Jem'Hadar Ship). The
 # Borg take the literal word, because a Borg vessel's name is already a
 # designation and 'Borg Cube 461' is how the Collective would put it.

