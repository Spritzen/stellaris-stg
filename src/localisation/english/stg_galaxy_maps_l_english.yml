 STG_galaxy_alpha_beta:0 "§YThe Known Galaxy — Small§!\n£system£ 95 Star Systems\n£pops£ 21 Empires\n\n§YStatic Galaxy§!\n\nThe Alpha and Beta Quadrants at their canon positions, with the Delta and Gamma powers beyond them. Every empire starts on its own home system: Sol, Qo'noS, Romulus, Cardassia, 40 Eridani, Bajor. No randomly generated empires.\n\nThe smallest and the sparsest: few stars between one empire and the next, so first contact comes early and there is little unclaimed room that somebody else does not already want."
 STG_galaxy_alpha_beta_medium:0 "§YThe Known Galaxy — Medium§!\n£system£ 600 Star Systems\n£pops£ 21 Empires\n\n§YStatic Galaxy§!\n\nThe Alpha and Beta Quadrants at their canon positions, with the Delta and Gamma powers beyond them. Every empire starts on its own home system: Sol, Qo'noS, Romulus, Cardassia, 40 Eridani, Bajor. No randomly generated empires.\n\nA full galaxy at the game's own medium scale — six times the stars of the small map, and space to survey and settle for a long while before the borders meet."
 STG_galaxy_alpha_beta_large:0 "§YThe Known Galaxy — Large§!\n£system£ 1000 Star Systems\n£pops£ 21 Empires\n\n§YStatic Galaxy§!\n\nThe Alpha and Beta Quadrants at their canon positions, with the Delta and Gamma powers beyond them. Every empire starts on its own home system: Sol, Qo'noS, Romulus, Cardassia, 40 Eridani, Bajor. No randomly generated empires.\n\nThe largest that fits: a thousand systems at the density of a vanilla huge galaxy, with real unexplored distance between the Alpha powers and the Delta and Gamma ones."
