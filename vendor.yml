# everywhere, and an INITIALIZER KEY silences the star-count warning for that
# one system. The last three below are the second kind — Real Space places two
# `class = "star"` planets against a one-star class, which vanilla never does
# in 40 files, but which demonstrably loads. Same verdict as the five above.
initializer_class_ack:
  - blue_stars
  - blue_supergiant
  - red_giant
  - yellow_stars
  - yellow_supergiant
  - rs_special_init_17
  - rs_special_init_19
  - rs_special_init_21

