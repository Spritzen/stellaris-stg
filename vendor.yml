# ── Renames ──────────────────────────────────────────────────────────────────
#
# Change a vendored file's NAME, leaving its contents alone. Applied by
# tools/vendor.py after every source, after src/, and after patches.
#
# WHY THIS EXISTS AND WHY HARVEST ORDER IS NOT ENOUGH. The rules at the top of
# this file say later sources overwrite earlier ones. True — of identical PATHS.
# Two sources shipping the same key under DIFFERENT filenames both ship, and
# once 48 mods are one mod there is no load order left to separate them: the
# engine decides by filename sort within the directory. Harvest order has no say
# in it at all. So a rename is the only lever that changes who wins a contested
# key, and before this the nearest thing was an src/ copy of the whole losing
# file altered in no way but its name.
#
# WHICH END OF THE SORT WINS DEPENDS ON THE DIRECTORY. FIOS directories keep the
# FIRST filename, everything else keeps the LAST. Irony Mod Manager's convention
# is `!!!_` to win a FIOS sort and `zzz_` to win a LIOS one. The list of FIOS
# directories, and why it is the one table in this repo not measured against
# vanilla, is .docs/decisions/29-merge-semantics-per-directory.md.
#
# Fields:
#   path    Generated path to rename. Must exist in the tree.
#   to      The new FILENAME — not a path. Moving a file to another directory
#           moves it to another database, which is not what this is for.
#   why     Mandatory. Same reason `patches:` demands one: a renamed file with
#           no recorded reason cannot be told from a mistake.
#   source  Optional. Asserts which source shipped it; a mismatch fails the
#           build, so a harvest-order change cannot silently re-point a rename.
#   win     Optional, `first` or `last`. Asserts the new name really does sort
#           that way in its directory — against vanilla's files as well as ours,
#           because vanilla's `00_` prefix is usually what a FIOS rename has to
#           beat. Without it a rename that fails to win looks correct forever.
#           This is Irony's "keep prepending characters until it sorts right"
#           loop, expressed as a check rather than a fixup.
  # ── 2026-08-07 live-run repairs ─────────────────────────────────────────────
  # Six files, all found by reading error.log after the 15:41 run. Each removes or
  # restores named lines in someone else's file; none changes a game balance value.
  # See .docs/decisions/40-live-run-2026-08-07-repairs.md.

  - path: common/governments/civics/pd_origins_unique.txt
    source: PD - Unique Worlds
    why: >-
      PD gates two origins on `NOT = { value = CRYO }`, but the CRYO species
      class is declared by NOTHING -- not by PD, not by any other source in this
      manifest, not by vanilla. It belongs to a PD companion mod we do not harvest. The
      engine reports `Invalid government species_class reference [CRYO]` and the
      clause is dead either way: with no species ever of class CRYO the NOT is
      always true, so deleting the line is behaviour-identical. Declaring a stub
      class instead (decision 32) would be wrong here -- nothing references CRYO
      for art, so a stub would be a phantom species class that exists only to
      satisfy a test that can never fail.
    replace:
      - from: "\t\tspecies_class = { NOT = { value = CRYO } }\r\n"
        to: ""
        count: 2

  - path: gfx/portraits/asset_selectors/klingon/klingon_male_clothes_combined.txt
    source: "Star Trek: New Horizons"
    why: >-
      `leader_class = legend` names a leader class 4.4 does not have -- vanilla
      declares exactly four in common/leader_classes/00_base_classes.txt
      (commander, envoy, official, scientist). The engine reports `Failed to
      deferred read key reference legend` twice. Removing the term leaves `NOR =
      { leader_class = commander }` and `OR = { leader_class = commander }`,
      which is what the trigger already evaluated to, since an unresolvable
      class matches nothing.
    replace:
      - from: " leader_class = legend"
        to: ""
        count: 2

  - path: common/starbase_buildings/sbx_3_0_starbase_buildings.txt
    source: Starbase Extended 3.0
    why: >-
      `category` is a field of a `resources` block, not a trigger.
      financial_space_center has one copy-pasted into its `potential` block,
      where 4.4 tries to resolve it as a scripted trigger and reports `Error in
      scripted trigger, cannot find: category`. This file uses the line
      correctly 45 other times inside `resources` and those are left alone --
      the anchor includes the `potential = {` opener, which is unique.
    replace:
      - from: "\tpotential = {\r\n\t\tcategory = starbase_buildings\r\n"
        to: "\tpotential = {\r\n"
        count: 1

  - path: gfx/projectiles/alt_strike_craft_weapons.txt
    source: ASB Ironman
    why: >-
      `shield_impact` accepts size small, medium or big; this one says `none`,
      so 4.4 rejects it and the strike-craft shield hit plays no effect at all.
      Vanilla's own strike_craft_weapons.txt uses `small` for every strike
      craft, which is the value taken here.
    replace:
      - from: "\t\tsize = none\r\n"
        to: "\t\tsize = small\r\n"
        count: 1

  - path: common/starbase_modules/sbx_3_0_starbase_modules.txt
    source: Starbase Extended 3.0
    why: >-
      SBX carries New Ship Classes compatibility hooks: conditional output gated
      on `has_starbase_building = mining_manager` /
      `assembly_line_manufacturing`, both NSC buildings. NSC is not in the
      harvest, so the key resolves against nothing and 4.4 reports `Failed to
      deferred read key reference` five times. The blocks are dead weight -- a
      trigger on a building that cannot exist never fires -- so removing them is
      behaviour-identical and costs no output any starbase could actually have
      earned.
    replace:
      - from: "\t\tproduces = { trigger = { has_starbase_building = mining_manager } minerals = 2 }\r\n"
        to: ""
        count: 1
      - from: "\t\tproduces = {\r\n\t\t\ttrigger = { has_starbase_building = assembly_line_manufacturing }\r\n\t\t\talloys = 1\r\n\t\t}\r\n\t\tupkeep = {\r\n\t\t\ttrigger = { has_starbase_building = assembly_line_manufacturing }\r\n\t\t\tminerals = 2\r\n\t\t\tenergy = 1\r\n\t\t}\r\n"
        to: ""
        count: 1
      - from: "\t\tproduces = {\r\n\t\t\ttrigger = { has_starbase_building = assembly_line_manufacturing }\r\n\t\t\tconsumer_goods = 2\r\n\t\t}\r\n\t\tupkeep = {\r\n\t\t\ttrigger = { has_starbase_building = assembly_line_manufacturing }\r\n\t\t\tminerals = 2\r\n\t\t\tenergy = 1\r\n\t\t}\r\n"
        to: ""
        count: 1

  - path: interface/zzz_sbx_3_0_starbase_view.gui
    source: Starbase Extended 3.0
    why: >-
      SBX's starbase view replaces vanilla's `design_info` window but omits the
      `design_name` instantTextBoxType the game writes the selected design's
      name into. 4.4 reports `Could not find instantTextboxType design_name in
      window design_info` EVERY TIME THE STARBASE VIEW IS OPENED -- one of only
      two errors in the 2026-08-07 run that recur during play rather than at
      load. The block is vanilla's own, copied from interface/starbase_view.gui
      with vanilla's position and sizing and retabbed to match this file.
      Anchored on the window's name+position+size together, because the size
      line alone occurs twice.
    replace:
      - from: "\t\t\t\tname = \"design_info\"\r\n\t\t\t\tposition = { x = 30 y = 94 }\r\n\t\t\t\tsize = { width = 295 height = 287 }\r\n"
        to: "\t\t\t\tname = \"design_info\"\r\n\t\t\t\tposition = { x = 30 y = 94 }\r\n\t\t\t\tsize = { width = 295 height = 287 }\r\n\t\t\t\tinstantTextBoxType = {\r\n\t\t\t\t\tname = \"design_name\"\r\n\t\t\t\t\tfont = \"cg_16b\"\r\n\t\t\t\t\ttext = \"\"\r\n\t\t\t\t\tposition = { x = 149 y = 17 }\r\n\t\t\t\t\tmaxWidth = 110\r\n\t\t\t\t\tmaxHeight = 20\r\n\t\t\t\t\tfixedSize = yes\r\n\t\t\t\t\tmultiline = no\r\n\t\t\t\t\talwaysTransparent = yes\r\n\t\t\t\t\tformat = center\r\n\t\t\t\t}\r\n"
        count: 1

  - path: gfx/models/ships/starbases/_starbase_entities_SBX_3_0_fallen_empire_02.asset
    source: Starbase Extended 3.0
    why: >-
      SBX built its fallen-empire 02/03/04 starbase assets by copying the 01
      file and renumbering every name, including the animation's `file =`. But
      vanilla ships only ONE such animation --
      fallen_empire_01_citadel_idle.anim -- so 02, 03 and 04 point at .anim
      files that exist in no tree, and 4.4 reports `Could not find animation
      file` for each. The animation NAME is left alone because the entities
      reference it; only the file it resolves to is repointed at the one that
      exists. Same FE citadel model family, so the skeleton matches.
    replace:
      - from: "\tfile = \"fallen_empire_02_citadel_idle.anim\""
        to: "\tfile = \"fallen_empire_01_citadel_idle.anim\""
        count: 1

  - path: gfx/models/ships/starbases/_starbase_entities_SBX_3_0_fallen_empire_03.asset
    source: Starbase Extended 3.0
    why: >-
      SBX built its fallen-empire 02/03/04 starbase assets by copying the 01
