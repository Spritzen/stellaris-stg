sources:
  # ── Real Space tier ────────────────────────────────────────────────────────
  # System Scale must beat Real Space: it rescales every value Real Space's
  # scripted_variables and matter decompressor define. (.docs/architecture/conflict-register.md)
  - id: "937289339"
    name: Real Space 4.0
    exclude:
      # Real Space's Patreon credit list, under `l_default`. Its two keys —
      # pl_starlords, pl_voidborns — are read by nothing in the built tree or
      # vanilla; the interface that displayed them is not part of what we
      # vendor. Names real people, which is the other reason not to ship it.
      - "localisation/replace/patrons_list.yml"
      # Real Space's mod menu, as an edict in Policies & Edicts. Its one entry
      # fires realspace.206 — a settings/advertising window for Real Space's
      # optional add-ons, none of which is in the harvest, in a mod that is
      # never published. The `patches:` entry above already skips the same
      # window at game start; this is the other door into it. Excluding the
      # file removes the edict; realspace.206 and its icon stay in the tree,
      # inert, so restoring it is a one-line revert. Reported 2026-08-08.
      - "common/edicts/realspace_edicts.txt"

  - id: "1887282318"
    name: Real Space - System Scale

  - id: "1915620447"
    name: Real Space - Ships in Scaling

  # ── Planetary Diversity family ─────────────────────────────────────────────
  # Base first, then extensions; extensions win their shared inline_scripts and
  # the placeholder civics file designed to be overwritten by a submod.
  - id: "819148835"
    name: Planetary Diversity
    exclude:
      # The same stub-for-a-present-submod as PD - Unique Worlds' above, and its
      # own first line reads "Irony this is a placeholder file please ignore it".
      # origin_pd_aw_tree_of_life is defined for real by Ascension Worlds in
      # zz_pd_aw_origins.txt, which out-sorts it; the stub's body is
      # `potential = { always = no }`, so if the sort ever went the other way
      # the origin would disappear from the empire designer with no error.
      - "common/governments/civics/pd_placeholder_origins_for_submods.txt"

  - id: "3173239930"
    name: PD - Vanilla Replacements

  - id: "2284514368"
    name: PD - Gaia Worlds

  - id: "1740165239"
    name: PD - Unique Worlds
    exclude:
      # A stub for a submod that IS in the harvest, which is what makes it
      # worth removing rather than harmless. It declares
      # civic_hive_pd_planetary_infesters with `potential = { always = no }` so
      # that references resolve when Ascension Worlds is absent — and Ascension
      # Worlds is present, defining the same key for real in pd_civics.txt.
      # common/governments/civics is LIOS, so the real file wins on filename
      # sort today; the stub's leading `!` sorts FIRST and would win outright in
      # any FIOS directory, and nothing on disk records which of the two this is
      # (decision 29). One key, checked: the file is three lines long.
      - "common/governments/civics/!_pd_placehold_civics_for_submods.txt"

  - id: "3241119393"
    name: PD - Ascension Worlds

  - id: "1732447147"
    name: PD - More Arcologies

  - id: "3142294658"
    name: PD - City Sets

  - id: "1866576239"
    name: PD - Planet View

  # ── Gameplay / galaxy generation ───────────────────────────────────────────
  - id: "1327874725"
    name: Yet Another Galaxy Enhancement Mod

  - id: "1326381312"
    name: Assorted Precursor Adjustments

  - id: "2002751329"
    name: Sensor Expansion

  - id: "3250900527"
    name: Starbase Extended 3.0

  # ── Graphics ───────────────────────────────────────────────────────────────
  - id: "1318671320"
    name: "!! K !! - Realistic Asteroids"
    zip: hd_asteroids.zip

  - id: "1506079770"
    name: Whiter Stars
    # Real Space owns star classes and ships art for all of them. Whiter Stars
    # is a 16-file mod declaring supported_version 3.*; letting it override
    # Real Space's star art here is an accident of tier placement, not a
    # decision. Its other 14 files are uncontested and kept. (.docs/architecture/conflict-register.md)
    exclude:
      - "gfx/map/star_classes/b_star.dds"
      - "gfx/map/star_classes/t_star.dds"

  - id: "1407858645"
    name: "!The Galaxy Is Flat"
    zip: "!flat_galaxy.zip"

  - id: "1880071041"
    name: ASB Ironman

  - id: "3397828987"
    name: Diverse Rooms (Updated)
    exclude:
      # A SECOND file claiming `room_selector`, which STNH's copy of vanilla's
      # room_textures.txt also claims. Which of two files wins one selector name
      # is decided by nothing on disk, and under the reading where this file
      # wins, its 277 `= { exists = owner }` ruler entries are unconditional
      # overrides that put every empire in the galaxy in a cave. Its 297
      # game_setup entries are merged into src/'s single selector by
      # tools/gen_room_selector.py, so the rooms stay offered and the ambiguity
      # is gone. See .docs/decisions/48-room-selector-merge.md.
      - gfx/portraits/asset_selectors/dr_room_textures.txt

  # RESTORED 2026-08-07, having been dropped 2026-08-02 on a misdiagnosis.
  #
  # It was dropped for causing `PLANET_SCALE_SYSTEM does not match in size with
  # ZOOM_STEPS_SYSTEM` (error D13 of the 2026-08-01 run). It did not: that error
  # was still in error.log five days later with this mod gone, and
  # ZOOM_STEPS_SYSTEM turns out to be settable by no file anywhere and fixed at
  # vanilla's 7 -- so Real Space - System Scale's own 8-entry PLANET_SCALE_SYSTEM
  # was always the cause. Restoring this mod neither causes nor fixes it.
  # See .docs/decisions/43-planet-scale-system-length.md.
  #
  # WHAT RESTORING IT ACTUALLY DOES, which the D13 story obscured: this file is
  # NOTHING BUT camera defines, `zzzzz_` sorts last, so it wins all 20 keys it
  # sets -- 17 of them from systemscale_defines.txt. There is no version of this
  # mod that coexists with System Scale's camera; patching out the contested keys
  # would leave three vanilla-owned scalars and nothing else. So this is a
  # straight choice between two camera tunings, and it is a taste call, not a
  # correctness one:
  #
  #     key                        vanilla   System Scale   Cinematic Camera
  #     SYSTEM_MIN_PITCH              20.0              1              -79.0
  #     SYSTEM_MAX_PITCH              80.0             89              179.0
  #     FOV                             35             35                 30
  #     SYSTEM_SLIDE_RADIUS_FACTOR     4.0           0.25                1.0
  #     ZOOM_STEPS_SYSTEM_PERCENTAGES    7              8                 13
  #
  # System Scale's camera is tuned to the systems it rescaled; Cinematic Camera's
  # is tuned to vanilla-scale ones. Reverting is deleting these two lines.
  #
  # ENTER_SYSTEM_ZOOM_STEP = 12 assumes this mod's own 13 zoom steps, and was
  # the one value flagged to watch in game. CONFIRMED GOOD on the 2026-08-07
  # live run: entering a system lands the camera sensibly, so the camera does
  # offer the steps ZOOM_STEPS_SYSTEM_PERCENTAGES declares and the engine's
  # ZOOM_STEPS_SYSTEM is measuring something else.
  # See .docs/decisions/43-planet-scale-system-length.md.
  - id: "703156866"
    name: Cinematic Camera

  # ── UI tier ────────────────────────────────────────────────────────────────
  # Submods override their base: Extended Topbar takes 11 UIOD files, Dark UI
  # takes 188. Both are settled by order alone. (.docs/architecture/conflict-register.md)
  - id: "1623423360"
    name: UI Overhaul Dynamic

  - id: "3090328185"
    name: UIOD - Extended Topbar for DLCs

  - id: "1993018111"
    name: UIOD - Dark UI
    exclude:
      # Re-skins for two mods that are not in the harvest. Dark UI ships
      # replacement textures at the Speed Dial and Tiny Outliner mods' own
      # paths; with neither mod present nothing declares a sprite over either
      # directory, and `make clutter` finds 30 and 8 files with zero reachable
      # siblings — the only two directories in the tree that are 100%
      # unreferenced. Same class as the five URP topbar-compat files decision 12
      # excluded, and the one nobody swept for afterwards.
      - "gfx/speeddial/**"
      - "gfx/tiny_outliner/**"

  # ── Sound / music ──────────────────────────────────────────────────────────
  # Additive; no contested paths.
  #
  # DROPPED 2026-08-02 -- Kammarheit (1409667987) and Apocryphos (1430192994).
  #
  # 919 MB and 78 files of dark-ambient soundtrack in a Star Trek total
  # conversion. Neither produced a single error and neither conflicts with
  # anything: this was purely a question of what the mod should sound like, and
  # .docs/planning/open-questions.md flagged it as a call to make deliberately rather than by
  # inertia. Made: STNH's own Trek score and Extended Soundtrack's vanilla
  # tracks carry it, and dark ambient is not what Star Trek sounds like.
  #
  # Restoring them is two lines here plus `make vendor`. Both remain snapshotted
  # in .source/, so this survives unsubscribing from them on Steam.
  - id: "1224507727"
    name: Extended Soundtrack
    zip: exst.zip

  # ── Universal Resource Patch — LAST of the script sources ──────────────────
  # Its README requires it: "Load order: Absolute bottom, below all mods,
  # including UI mods." Its topbar_other_resource_groups.txt is 1,271 lines
  # against vanilla's 41 and is a strict superset of every other contender —
  # it already carries Planetary Diversity's resources AND an annotated STNH
  # block. Loaded early, PD - Unique Worlds' 42-line version would overwrite it
  # and STG would silently lose Trek resource display in the topbar. Loaded
  # last, it wins outright and the conflict needs no merge. (.docs/architecture/harvest-order.md)
  - id: "1595876588"
    name: "!!!Universal Resource Patch"
    # Five of URP's six interface/resource_groups/ files are compatibility shims
    # for topbar mods that are NOT in the harvest -- their own first lines say so
    # ("#Compatibility for Improved Topbar", "# ... Compact UI Topbar",
    # "#Compatibility for Star Trek: New Civilisations"). Each declares a topbar
    # group (tb_extras_group, tp_compact_ui_others_group_1..3, tb_nanites_group)
    # that NOTHING in STG or in vanilla references -- checked by grep across
    # interface/, gfx/, common/, src/ and /stellaris/interface/. They are inert.
    #
    # They are also not silent: each independently lists ~939 strategic resources
    # and re-reports every one that does not resolve, which was 4,645 of the
    # 7,635 records in the 2026-08-02 live run -- 61% of the whole log for five
    # files that cannot draw anything.
    #
    # This is decision 12 rule 2, not a drop: URP itself stays, and the file it
    # is vendored for (topbar_other_resource_groups.txt, the 1,271-line superset
    # carrying PD's resources and an annotated STNH block) is untouched.
    #
    # NOTE the space before ".txt" in group_2 -- it is in URP's own filename.
    exclude:
      - "interface/resource_groups/tb_extras_group.txt"
      - "interface/resource_groups/tp_compact_ui_others_group_1.txt"
      - "interface/resource_groups/tp_compact_ui_others_group_2 .txt"
      - "interface/resource_groups/tp_compact_ui_others_group_3.txt"
      - "interface/resource_groups/topbar_tb_nanites_group.txt"

  # ── Star Trek: New Horizons — art only, additive only ──────────────────────
  # Never STNH's common/, events/, interface/ or map/: that is the
  # total-conversion script we are deliberately not shipping. `additive_only`
  # makes STNH lose all 137 contested paths — planet-view backdrops, vanilla
  # named planet pictures and a vanilla shipset — to the mods that own them.
  # The rule is free: none of STG's Trek identity is in the contested set.
  #
  # gfx/models/portraits carries the Trek species portrait TEXTURES (794 MB);
  # gfx/portraits/portraits is the 1.2 MB of .txt declarations pointing at
  # them. Both halves are required or every portrait resolves to nothing.
  # (.docs/architecture/harvest-order.md, including the 2026-08-01 correction)
  #
  # `additive_only` only protects paths an earlier SOURCE claims. It does not
  # protect vanilla. STNH is a 3.12-era total conversion, so several of its art
  # files shadow a vanilla 4.4 path and silently drop content vanilla still
  # references. The three below are excluded outright; see decision 08.
  - id: "688086068"
    name: "Star Trek: New Horizons"
    additive_only: true
    # STNH's event pictures are 620×264; vanilla's are 450×150 at the same 569
    # paths. The sprites that declare them stay vanilla's and the window that
    # draws them is UIOD's, whose scale = 1.5 is cut for 450×150 — so the art
    # rendered 930×396 inside a 693×239 frame. Nothing dangled and make validate
    # was clean throughout. Re-cut to whatever vanilla ships at each path — and
    # since 2026-08-09, to whatever vanilla ships across the FAMILY, which is
    # what lets a Trek event use a picture vanilla has no path for at all.
    # See .docs/decisions/42-event-picture-geometry.md and
    # .docs/decisions/74-event-picture-families.md.
    # And the planet view's city layers, 2026-08-08 — the same defect one
    # directory over, found because a live run reported the city art sitting
    # too low on every planet while the backdrop behind it looked right.
    # Vanilla ships all 266 of its `*_city_l0N.dds` at exactly 800×400 and all
    # 91 of its `*_room.dds` at exactly 952×340; STNH honours the room canvas
    # (316 of 324) and not the city one, because its own interface/ — which we
    # never vendor — was cut for 560×280, exactly 70% of vanilla's. 153 files
    # shadow a vanilla path at the wrong size, all 153 STNH's. The backdrop
    # was right the whole time because `additive_only` makes STNH lose all 121
    # gfx/portraits/environments/ paths to the mods that own them (.docs/architecture/stnh-art.md),
    # so only the half nobody else claims was ever wrong.
    # See .docs/decisions/58-city-set-geometry.md.
    resample_to_vanilla:
      # ORDER IS LOAD-BEARING: fnmatch's `*` spans `/`, so the broad event
      # picture glob below matches `origins/` too and would claim these first.
      # Vanilla ships all 59 of its origin pictures at 220×115 against 450×150
      # everywhere else in the directory — a second family, not a second size.
      # See .docs/decisions/74-event-picture-families.md.
      - glob: "gfx/event_pictures/origins/*.dds"
        target: family
      # `target: family`, added 2026-08-09. Decision 42's per-path rule re-cut
      # the 569 STNH pictures that shadow a vanilla path and was structurally
      # blind to the 865 that shadow nothing — which is every picture Phase 4
      # would want to put on a Trek event. Those are 620×264, and UIOD's
      # `scale = 1.5` draws them 930×396 inside a 693×239 frame: decision 42's
      # exact defect, waiting behind the first `.gfx` that declares one.
      # Vanilla is 580/580 at 450×150 here once origins are claimed above.
      - glob: "gfx/event_pictures/*.dds"
        target: family
      # THE CITY SETS ARE ONE DIRECTORY, TWO FAMILIES, TWO FIT MODES — and they
      # must be two rules
      # rather than one `*.dds`, because the target and the canvas are now both
      # read off the family (see resample_plan) and vanilla's two families
      # disagree: 266/271 city layers at 800×400, 91/91 rooms at 952×340.
      #
      # `fit: canvas`, not the default crop-to-fill: a city layer is one of six
      # composited by exact pixel position, and 41 of these are STNH's 560×280
      # canvas top-trimmed, so a centre crop would cut 20% off the width of each.
      - glob: "gfx/portraits/city_sets/*_city_l*.dds"
        fit: canvas
        # `target: family` because six of these prefixes — klingon, vulcan_01,
        # cardassian_01, borg_01, tholian_01, undine_01, named by six of our
        # empires — shadow NO vanilla path, so reading the target off one
        # vanilla file has no answer and decision 58 had to leave them at 70%.
        # Vanilla is 266/271 at 800×400 here, so the family has one.
        target: family
      # A room is the opposite kind of art: ONE full-bleed backdrop drawn behind
      # the leader, so its aspect ratio is load-bearing and its pixel offsets
      # are not. Crop-to-fill preserves the aspect; canvas-padding would squash
      # vulcan_room's 1026×403 by 16% vertically to reach 952×340.
      - glob: "gfx/portraits/city_sets/*_room.dds"
        fit: crop
        # Same reason, and vanilla is 91/91 at 952×340 here — the 11 Trek rooms
        # STNH ships under its own names are the ones with no vanilla path.
        target: family
    exclude:
      # Drops 47 of vanilla 4.4's 72 flag colours (dark_red, white, off_white …)
      # while adding 2,075 STNH ones. Vanilla prescripted empires reference the
      # dropped names. STNH's additions are customcolorN hsv ramps we don't use.
      - "flags/colors.txt"
      # A 128×128 DDS with no extension, so no loader in the engine can open it
      # by any name. Sits beside STNH's own gfx/models/test_diffuse.dds, which
      # is the file this was cut from.
      - "gfx/models/ships/borg_01/test_diff"
      # Adds nothing — every delta is either STNH's own 3.12 planet-view layout
      # (which UIOD supersedes) or a deletion: the arkship planet layers, the
      # origin_fallen_empire_hive environment override, and the psionic
      # ascension portrait_evolution entry. It also repoints the main menu at
      # STNH's frontend_background_entity.
      - "gfx/portraits/portraits/00_portraits_main.txt"
      # Every entry is gated on STNH scripted triggers from its common/, which
      # we don't vendor, so none of its Starfleet leader backgrounds can ever
      # fire — while it drops the four vanilla legendary paragon backgrounds
      # (azaryn, beholder, keides, skrand). Rebuild properly in Phase 3.
      - "gfx/portraits/asset_selectors/paragon_backgrounds.txt"
      # ── gfx/particles: the 11 paths that shadow VANILLA ────────────────────
      # `additive_only` protects paths an earlier SOURCE claimed; it does not
      # protect vanilla, and these 11 are STNH 3.12-era copies of vanilla 4.4
      # files. Excluded for exactly the reason in decision 08. The other 310
      # files under gfx/particles are uniquely STNH's and arrive untouched.
      - "gfx/particles/muzzle_flash.dds"
      - "gfx/particles/_projectiles_particles.gfx"
      - "gfx/particles/repair_ship.dds"
      - "gfx/particles/flare_wide.dds"
      - "gfx/particles/combat/missile_large_idle.asset"
      - "gfx/particles/combat/missile_medium_idle.asset"
      - "gfx/particles/misc/minefield_mine_effect.asset"
      - "gfx/particles/misc/ship_aura_repairing_effect.asset"
      - "gfx/particles/misc/ship_repairing_effect.asset"
      - "gfx/particles/misc/ship_aura_minefield_effect.asset"
      - "gfx/particles/ships/energy_core_effect.asset"
      # ── STNH Klingon and Romulan hulls flying under Federation culture ──────
      # 169 of the 250 dangling mesh references on the first build of the
      # Walshicus tier came from these two files alone: they are warship
      # variants declared in gfx/models/ships/federation/ whose meshes live in
      # klingon/, klingon_01/02/04, romulan/ and romulan_01 — the directories
      # that either collide with a Walshicus set or are no longer harvested.
      # Nothing we keep references them; gen_shipsets.py borrows stations and
      # civilian craft from `federation`, never warships.
      - "gfx/models/ships/federation/federation_klingon_integrated_ships.asset"
      - "gfx/models/ships/federation/federation_romulan_integrated_ships.asset"
      # ── The two cross-culture aggregators in starbases/ and other/ ─────────
      # Both name art from EVERY STNH culture, so harvesting either one drags
      # the whole 104-directory tree back in behind it. sth_starbase_entities
      # declares one starbase set per culture (~19 entities × 30 cultures);
      # empire_select_dummy is the empire-selection preview and names every
      # culture's corvette. The five cultures we still take STNH art for get
      # their stations from their own directories and from the donors
      # gen_shipsets.py borrows from, not from these.
      - "gfx/models/ships/starbases/sth_starbase_entities.asset"
      - "gfx/models/ships/other/empire_select/empire_select_dummy.asset"
      # Four more files whose whole content is art for cultures the harvest no
      # longer takes: derelict/recycling station decor built from Klingon,
      # Romulan, Dominion and Cardassian hulls, the Borg transwarp catapult, and
      # two hero ships (ENT-era Romulan and the Vulcan Seleya) whose meshes live
      # in romulan_01/ and vulcan_01/. Nothing else references them.
      - "gfx/models/ships/starbases/recycle/recycle_stations.asset"
      - "gfx/models/ships/other/transwarp_conduit.asset"
      # Declares `yridian_destroyer_entity` a SECOND time, and points it at
      # `federation_01_corvette_frame_mesh`. Yridian ship art comes from the
      # Walshicus Yridian Shipset now (decision 18), whose own
      # yridian/destroyer/yridian_destroyer.asset declares the same name against
      # yridian_destroyer_mesh. `other/` sorts before `yridian/`, so STNH's is
      # read first — and which of two duplicate declarations the engine keeps is
      # not recorded anywhere, so rather than bet on it, remove the conflict.
      # The only name unique to this file, yridian_destroyer_section_1_entity, is
      # referenced by nothing in the built tree.
      # One of the 18 mod-vs-mod duplicates in the 2026-08-07 run; the other 17
      # are third-party files duplicating within themselves or within their own
      # mod family. See .docs/decisions/33-duplicate-entity-declarations.md.
      - "gfx/models/ships/other/yridian_destroyer.asset"
      - "gfx/models/ships/hero_ships_01/hero_ships_01_ENT_romulan_coreA.asset"
      - "gfx/models/ships/hero_ships_01/hero_ships_01_ENT_seleya_coreA.asset"
    include:
      - gfx/portraits
      # ── gfx/models/ships: THIRTEEN directories of 104, not the tree ─────────
      # Walshicus' shipsets took over ship art for nine of the fourteen Trek
      # cultures (decision 18), so all STNH is still asked for is the five that
      # have no such set — BAJ, TRI, ADR, BOL, BRE — plus the directories
      # tools/gen_shipsets.py borrows their stations and civilian craft from.
      # The list is READ OUT of that script's own output, not guessed, and the
      # dangling-mesh half of `make validate` closes the loop on what those
      # directories then reference.
      #
      # Taking the tree instead is not merely wasteful, it is wrong: STNH has
      # directories named `klingon` and `romulan`, and so does Walshicus. Same
      # path, so the newer art wins the .gfx that DECLARES a mesh while STNH's
      # .asset that USES it survives — 7 dangling references to
      # romulan_research_station_mesh, caught by make validate on the first
      # build of this tier.
      - gfx/models/ships/bajoran_01
      - gfx/models/ships/federation_32
      - gfx/models/ships/andorian_01
      - gfx/models/ships/bolian_01
      - gfx/models/ships/breen_01
      # Donors: stations and civilian craft the five have none of.
      - gfx/models/ships/federation
      - gfx/models/ships/hero_ships_01
      - gfx/models/ships/suliban_01
      - gfx/models/ships/andromedan_01
      - gfx/models/ships/cytherian_01
      - gfx/models/ships/generic_01
      - gfx/models/ships/generic_05
      - gfx/models/ships/generic_06
      - gfx/models/ships/generic_07
      # Shared art the thirteen above reference across directory boundaries.
      # Added because `make validate` named them, one rebuild at a time — not
      # because the layout suggested them.
      - gfx/models/ships/starbases
      - gfx/models/ships/other
      - gfx/models/ships/generic_02
      - gfx/models/ships/maquis_01
      # ── Added 2026-08-03: the .mesh FILES the art above declares ────────────
      # federation/federation_all_ships.gfx and other/borg_unicomplex.gfx are
      # kept, and they DECLARE 15 meshes whose `file =` paths point in here.
      # The name check was satisfied — the declaration was present — so the
      # include list converged without them and the files were simply absent.
      # The engine substituted test_object.mesh, which has no animation:
      # 1,453 pdx_entity.cpp:266 records across 311 entities in one live
      # run. `check_gfx_file_refs` is the check that can now see this.
      - gfx/models/ships/federation_01
      - gfx/models/ships/federation_02
      - gfx/models/ships/federation_03
      - gfx/models/ships/federation_04
      - gfx/models/ships/borg_01
      - gfx/models/portraits
      - gfx/event_pictures
      - gfx/loadingscreens
      - flags
      - music
      - sound
      # ── Added 2026-08-02: art the art we already take REFERENCES ───────────
      # `gfx/models/ships` brought in files naming siblings that lived outside
      # every include prefix, so 184 records in the 2026-08-02 live run were
      # STNH art asking for STNH art we had declined to vendor. Measured from
      # the log, not guessed: 106 of the 127 `Couldn't find particle 3D object`
      # names are declared by four files under gfx/particles, and the
      # `Couldn't find mesh "space_dust_0N_mesh"` pair plus nine
      # `Failed to find texture` records name loose files at the top of
      # gfx/models.
      #
      # gfx/particles is taken as a DIRECTORY (321 files) rather than by naming
      # the four .gfx registration files, because a pdxparticle entry is only
      # half a particle -- `type = "cannon_blue_01_muzzle"` resolves to a
      # sibling .asset, and naming registrations without definitions would swap
      # one dangling reference class for another. The 11 members that shadow a
      # vanilla path are excluded above.
      - gfx/particles
      # gfx/models is NOT taken wholesale -- that is STNH's whole 3.12-era model
      # tree over vanilla's. Only the loose files realspace_other_entities.asset
      # actually names.
      - gfx/models/space_dust_01.mesh
      - gfx/models/space_dust_02.mesh
      - gfx/models/space_dust_01_diffuse.dds
      - gfx/models/space_dust_02_diffuse.dds
      - gfx/models/space_dust_03_diffuse.dds
      - gfx/models/space_dust_04_diffuse.dds
      - gfx/models/space_dust_05_diffuse.dds
      - gfx/models/space_dust_06_diffuse.dds
      - gfx/models/space_dust_07_diffuse.dds
      - gfx/models/dust_nebula_collapsar_01_diffuse.dds
      - gfx/models/dust_nebula_collapsar_02_diffuse.dds
      # ── Added 2026-08-03: the TEXTURES the art above declares ──────────────
      # Group C in the 08-13 analysis: 139 `Failed to find texture` records in
      # the live run, and NOT ONE of the named files was in the built tree. A
      # `.gfx` meshsettings block names its textures as bare filenames
      # (`texture_diffuse = "transparent_diffuse.dds"`), so the include list —
