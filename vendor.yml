  # --- Starbase Extended: an unguarded scope switch to solar_system ----------
  # `advanced_military_program.potential` switches straight to `solar_system`
  # with no guard, and the 2026-08-07 run logged
  # `Invalid context switch [solar_system]` from a starbase scope for it -- the
  # only error of that run outside the startup window that was ours.
  #
  # The guard is not invented. Vanilla's one `potential` block in
  # common/starbase_buildings that reaches for `solar_system` opens with
  # `is_normal_starbase = yes` + `exists = owner`, and SBX's own other eight all
  # gate on `has_starbase_size >=` first. Line 772 is the single block in either
  # file that switches unguarded, and it is the one that failed. `potential` is
  # a plain AND, so prepending the vanilla pair narrows nothing a real starbase
  # in a system would have passed.

  - path: common/starbase_buildings/sbx_3_0_starbase_buildings.txt
    source: Starbase Extended 3.0
    why: >-
      `advanced_military_program.potential` switches to `solar_system` from a
      starbase scope with no guard -- `Invalid context switch [solar_system]`
      in the 2026-08-07 run, during play rather than at load. Prepends
      vanilla's own `is_normal_starbase = yes` + `exists = owner`, the pair its
      single comparable block uses and which SBX already uses eight times in
      this file. Unique in the file.
    replace:
      - from: "\tpotential = { solar_system = { any_system_planet = { is_owned_by = from } } }"
        to: "\tpotential = { is_normal_starbase = yes exists = owner solar_system = { any_system_planet = { is_owned_by = from } } }"
        count: 1

  # --- Starbase Extended: modules with TWO `potential` blocks ----------------
  # Six starbase/orbital-ring modules declare `potential = { }` twice. It is
  # one key, so 4.4 keeps one and logs `Duplicate trigger` -- six records in the
  # 2026-08-02 run -- and whichever it discards, a real condition is lost: the
  # first block is the technology and starbase-type gate, the second is the
  # build-count cap that stops the AI stacking twenty of the same module.
  #
  # Merged rather than deleted. Both blocks are conditions the module plainly
  # wants, they contradict nothing, and `potential` is a plain AND, so folding
  # the second block's lines into the first preserves exactly the behaviour SBX
  # wrote and nothing else. Nothing is invented: every line below is moved, not
  # authored.

