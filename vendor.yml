  # --- STNH advisor voices: Breen and Romulan gate on flags nothing sets ------
  # The same defect is_borg_empire had before src/common/scripted_triggers/
  # stg_borg_triggers.txt gave it a body, and it is worth reading that file's
  # header before touching this: an advisor voice is chosen in the EMPIRE
  # CREATOR, before any event has run, so a country flag cannot be the gate. No
  # event in vanilla, in STNH or in src/ ever sets breen_confederacy or
  # romulan_star_empire -- they are prescripted-country KEYS in
  # src/prescripted_countries/, which is a different namespace and not a country
  # property. So both weights stay at base = 0 and vanilla's l_machine (8) or an
  # ethic voice wins. Measured: the 2026-08-08 run selected the stock advisor
  # for the Breen and Romulan empires with no error to show for it, because a
  # weight of zero is not an error.
  #
  # owner_species/is_species_class is what stg_borg_triggers.txt settled on for
  # exactly this shape of question, and it survives the empire creator.
  # BRE and ROM are both declared `randomized = no` in
  # src/common/species_classes/stg_species_classes.txt, so no random AI empire
  # can wear either class and the check cannot fire on someone else's empire.
  #
  # A PATCH AND NOT AN src/ OVERRIDE, unlike sound/sth_soundgroups.asset next
  # door. That file we rebuilt and mean to own; this one is 50 lines of which we
  # are changing two, and the rest -- including the l_vo_borg block -- is
  # correct as STNH wrote it. If STNH ever sets these flags properly the patch
  # stops matching and the build says so, which is the outcome we want.
  - path: sound/advisor_voice_types/STH_advisor_voice_types.txt
    source: "Star Trek: New Horizons"
    why: >-
      l_vo_breen's weight gates on has_country_flag = breen_confederacy, which
      nothing in the build ever sets, so the Breen advisor voice can never be
      chosen. Replaced with the species-class check stg_borg_triggers.txt
      established for the Borg. Note the trailing space, which is STNH's.
    replace:
      - from: "\t\t\thas_country_flag = breen_confederacy "
        to: "\t\t\towner_species = { is_species_class = BRE }"
        count: 1
  - path: sound/advisor_voice_types/STH_advisor_voice_types.txt
    source: "Star Trek: New Horizons"
    why: >-
      l_vo_rom's weight gates on has_country_flag = romulan_star_empire, which
      nothing in the build ever sets, so the Romulan advisor voice can never be
      chosen. Replaced with the species-class check stg_borg_triggers.txt
