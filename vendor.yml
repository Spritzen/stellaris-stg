  - sol_system_solsector_large
  - sol_system_solsector_small

# Mod families whose members override each other on purpose. Read by
# tools/validate.py's check_key_conflicts: a key contested only WITHIN one
# family is the family working as designed -- .docs/architecture/conflict-register.md already settles these
# as "extension wins, record don't merge" -- and is not reported. A key
# contested ACROSS families still is.
#
# Declared rather than inferred. "Planetary Diversity" and "PD - Gaia Worlds"
# share no usable prefix, and guessing family membership from source names is
# how you quietly stop reporting a real conflict. Without this, PD's submods
# alone account for 75 of 88 findings and bury the one that matters.
#
# `members:` is required. Without it the family entries are a block sequence
# nested directly under a mapping key, which is not valid YAML -- and because
# tools/validate.py reads this block with a regex rather than a parser, nothing
# noticed for as long as nobody ran `make vendor`. It is checked now:
# check_manifest_parses() loads vendor.yml the way vendor.py does.
key_conflict_families:
  - name: Planetary Diversity
    members:
      - Planetary Diversity
      - PD - Vanilla Replacements
      - PD - Gaia Worlds
      - PD - Unique Worlds
      - PD - Ascension Worlds
      - PD - More Arcologies
      - PD - City Sets
      - PD - Planet View
  - name: Real Space
    members:
      - Real Space 4.0
      - Real Space - System Scale
      - Real Space - Ships in Scaling
  - name: UI Overhaul Dynamic
    members:
      - UI Overhaul Dynamic
      - UIOD - Extended Topbar for DLCs
      - UIOD - Dark UI

# `reserved:` used to live here — the list of paths vendor.py refused to write,
# because the mod tree was the repo root and a source shipping `tools/` (a real
# vanilla game directory as well as ours) would have overwritten the build
# scripts with game data. Decision 13 moved the tree to stg-build/, so that
# collision is structurally impossible and the guard was removed rather than
# kept as a check that can no longer fire. It also un-breaks the case it was
# guarding: `stg-build/tools/` is now simply the game folder of that name, which
# a source is entitled to ship. No source in the harvest currently does.

# ── Patches ──────────────────────────────────────────────────────────────────
#
# Literal find-and-replace against a generated file, applied by tools/vendor.py
# after every source AND after src/. THE MECHANISM .docs/architecture/vendored-merge.md rule 1 HAS
# ALWAYS NAMED and nobody had built until 2026-08-02.
#
# WHEN TO USE A PATCH INSTEAD OF AN src/ OVERRIDE. A patch changes named bytes
# in someone else's file. An src/ override replaces the whole file. Use a patch
# when the fix is a handful of lines in a large file you have no wish to own --
# a typo in a 500-line particle asset. Use src/ when you genuinely mean to own
# the file, as with gfx/FX/pdxmesh.shader.
#
# The reason to prefer a patch is how it FAILS. If `from` stops matching, the
# build STOPS and names the file: the source mod has changed and this fix may no
# longer be needed or may no longer be right. An src/ copy in that same
# situation says nothing and quietly keeps shipping our stale version of a file
# the author has since fixed themselves. `why` is mandatory for the same reason:
# a patch to someone else's file with no recorded reason is indistinguishable
# from a bug.
#
# `count` asserts how many occurrences to expect; a mismatch fails the build.
#
# ── ASB Ironman's 3.x-era .asset files ───────────────────────────────────────
#
# All 42 patched errors below are ASB Ironman's, measured from the 2026-08-01
# run: every `.asset`/parse error in the log except 4 belonging to Starbase
# Extended. ASB is KEPT -- it is a combat VFX mod and its value survives Phase 3
# (decision 11) -- but it was last updated against a 3.x Stellaris and 4.4's
# parser rejects several things it does. A rejected curve or emitter is not just
# log noise: the affected muzzle, shield-hit and explosion effects fall back or
# do not play at all, which is the mod's entire purpose.
#
# Most of these are not version drift at all -- they are plain typos in ASB's
# source that 3.x happened to tolerate.

patches:

  # --- ASB typo: "nimation" for "animation", in five files -------------------
  # Not version drift; the leading 'a' is simply missing. Each file has exactly
  # one, and the other animation blocks in the same files are spelled correctly.
  - path: gfx/particles/combat/cannon_shield_hit_effect.asset
    source: ASB Ironman
    why: >-
      ASB typo -- the animation block is spelled "nimation", so 4.4 rejects the
      token and drops the rest of the effect. One occurrence per file.
    replace:
      - from: "\tnimation={"
        to: "\tanimation={"
        count: 1

  - path: gfx/particles/combat/kinetic_artillery_shield_hit_effect.asset
    source: ASB Ironman
    why: >-
      ASB typo -- the animation block is spelled "nimation", so 4.4 rejects the
      token and drops the rest of the effect. One occurrence per file.
    replace:
      - from: "\tnimation={"
        to: "\tanimation={"
        count: 1

  - path: gfx/particles/combat/adv_kinetic_artillery_shield_hit_effect.asset
    source: ASB Ironman
    why: >-
      ASB typo -- the animation block is spelled "nimation", so 4.4 rejects the
      token and drops the rest of the effect. One occurrence per file.
    replace:
      - from: "\tnimation={"
        to: "\tanimation={"
        count: 1

  - path: gfx/particles/combat/neutron_torpedoes_shield_hit_effect.asset
    source: ASB Ironman
    why: >-
      ASB typo -- the animation block is spelled "nimation", so 4.4 rejects the
      token and drops the rest of the effect. One occurrence per file.
    replace:
      - from: "\tnimation={"
        to: "\tanimation={"
        count: 1

  - path: gfx/particles/combat/proton_torpedoes_shield_hit_effect.asset
    source: ASB Ironman
    why: >-
      ASB typo -- the animation block is spelled "nimation", so 4.4 rejects the
      token and drops the rest of the effect. One occurrence per file.
    replace:
      - from: "\tnimation={"
        to: "\tanimation={"
        count: 1

  # --- 3.x field removed in 4.x: `volume` inside an entity sound block -------
  # Vanilla 4.4 uses `sound = { soundeffect = "x" }` and never carries a volume
  # there -- grep confirms zero uses across /stellaris/gfx/models/combat_items/.
  # Dropping the field leaves the soundeffect intact at its default volume.
  - path: gfx/models/combat_items/_ballistics_entities_disr.asset
    source: ASB Ironman
    why: >-
      `volume` is not a valid key in a 4.4 entity sound block; vanilla never
      uses it. 12 disruptor muzzle and distance-fire events, all identical.
    replace:
      - from: " volume = 0.2 }"
        to: " }"
        count: 12

  # --- 3.x particle emitter fields removed in 4.x ---------------------------
  # box_emitter_x/y/z still exist in vanilla 4.4 (272 files use them);
  # box_emitter_yaw, _pitch and _velocity do not exist at all (zero uses).
  # Removing the lines leaves the box emitter working on its surviving axes.
  - path: gfx/particles/combat/neutron_torpedoes_hit_effect.asset
    source: ASB Ironman
    why: >-
      box_emitter_yaw and box_emitter_pitch do not exist in 4.4.
    replace:
      - from: "\t\tbox_emitter_yaw={ 180.000 90.000 }\r\n"
        to: ""
        count: 1
      - from: "\t\tbox_emitter_pitch={ 0.000 45.000 }\r\n"
        to: ""
        count: 1

  - path: gfx/particles/combat/neutron_torpedoes_shield_hit_effect.asset
    source: ASB Ironman
    why: >-
      box_emitter_yaw and box_emitter_pitch do not exist in 4.4.
    replace:
      - from: "\t\tbox_emitter_yaw={ 180.000 90.000 }\r\n"
        to: ""
        count: 1
      - from: "\t\tbox_emitter_pitch={ 0.000 45.000 }\r\n"
        to: ""
        count: 1

  - path: gfx/particles/combat/proton_torpedoes_hit_effect.asset
    source: ASB Ironman
    why: >-
      box_emitter_yaw and box_emitter_pitch do not exist in 4.4.
    replace:
      - from: "\t\tbox_emitter_yaw={ 180.000 90.000 }\r\n"
        to: ""
        count: 1
      - from: "\t\tbox_emitter_pitch={ 0.000 45.000 }\r\n"
        to: ""
        count: 1

  - path: gfx/particles/combat/proton_torpedoes_shield_hit_effect.asset
    source: ASB Ironman
    why: >-
      box_emitter_yaw and box_emitter_pitch do not exist in 4.4.
    replace:
      - from: "\t\tbox_emitter_yaw={ 180.000 90.000 }\r\n"
        to: ""
        count: 1
      - from: "\t\tbox_emitter_pitch={ 0.000 45.000 }\r\n"
        to: ""
        count: 1

  - path: gfx/particles/combat/custom_disruptor_1_hit_effect.asset
    source: ASB Ironman
    why: >-
      box_emitter_velocity does not exist in 4.4.
    replace:
      - from: "\t\tbox_emitter_velocity=1000\r\n"
        to: ""
        count: 1

  - path: gfx/particles/combat/custom_disruptor_2_hit_effect.asset
    source: ASB Ironman
    why: >-
      box_emitter_velocity does not exist in 4.4.
    replace:
      - from: "\t\tbox_emitter_velocity=1000\r\n"
        to: ""
        count: 1

  - path: gfx/particles/combat/custom_disruptor_3_hit_effect.asset
    source: ASB Ironman
    why: >-
      box_emitter_velocity does not exist in 4.4.
    replace:
      - from: "\t\tbox_emitter_velocity=1000\r\n"
        to: ""
        count: 1

  # --- Curve keyframes out of chronological order ---------------------------
  # A curve={} is a flat list of (time, value) pairs and the engine requires
  # times to increase: "Timestamps need to be larger than the previous
  # timestamp". A rejected curve means the property it drives -- alpha, size --
  # is not animated at all.
  #
  # ONE transposed pair, shared verbatim by three files at five sites. Every
  # other timestamp in the list is already ascending; 0.918 and 0.903 are simply
  # the wrong way round. Swapping them is the whole fix and invents nothing.
  - path: gfx/particles/technosphere_explosion.asset
    source: ASB Ironman
    why: >-
      Curve keyframes 0.918 and 0.903 are transposed, so 4.4 rejects the curve.
      Swapped into ascending order; no values changed.
    replace:
      - from: "0.918 0.934 0.903 0.920"
        to: "0.903 0.920 0.918 0.934"
        count: 1

  - path: gfx/particles/ships/player_ship_explosion_effect.asset
    source: ASB Ironman
    why: >-
      Same transposed keyframe pair as technosphere_explosion.asset.
    replace:
      - from: "0.918 0.934 0.903 0.920"
        to: "0.903 0.920 0.918 0.934"
        count: 1

  - path: gfx/particles/ships/habitat_explosion_effect.asset
    source: ASB Ironman
    why: >-
      Same transposed keyframe pair, three times in this file (lines 386, 399,
      451) -- three separate curves carrying the identical mistake.
    replace:
      - from: "0.918 0.934 0.903 0.920"
        to: "0.903 0.920 0.918 0.934"
        count: 3

  # --- Malformed curves: odd value count, so the pairs do not close ----------
  # Unlike the transposition above, these cannot be repaired without a
  # judgement, and the judgement is recorded rather than hidden.
  - path: gfx/particles/combat/arc_trail_effect.asset
    source: ASB Ironman
    why: >-
      JUDGEMENT, NOT RECONSTRUCTION. The curve has SEVEN values, so it does not
      divide into (time, value) pairs at all, and its times read 0.000 0.000
      1.000. The animation is a 10 ms "grow2" spike, so the intended shape is
      unambiguous -- rise to 1 and fall back to 0 -- but the midpoint time was
      typed as 0.000 and a stray eighth value is missing. Rewritten as a
      symmetric spike, 0.000 0.000 / 0.500 1.000 / 1.000 0.000. Any midpoint in
      (0,1) works; 0.500 is a choice. Today the curve is rejected outright and
      the property is not animated at all, so this is strictly better than the
      status quo -- but change it freely if the effect looks wrong in game.
    replace:
      - from: "0.000 0.000 0.000 1.000 1.000 0.000 0.000"
        to: "0.000 0.000 0.500 1.000 1.000 0.000"
        count: 1

  - path: gfx/particles/combat/focused_arc_trail_effect.asset
    source: ASB Ironman
    why: >-
      Identical malformed seven-value curve to arc_trail_effect.asset, and the
      same judgement applies -- see that entry.
    replace:
      - from: "0.000 0.000 0.000 1.000 1.000 0.000 0.000"
        to: "0.000 0.000 0.500 1.000 1.000 0.000"
        count: 1

  - path: gfx/particles/combat/auto_cannons_small_muzzle_bullets_effect.asset
    source: ASB Ironman
    why: >-
      SUBSTITUTION, NOT RECONSTRUCTION -- the weakest patch here, flagged as
      such. The curve has FIVE values (1.000 0.706 0.564 0.150 0.000): an odd
      count that cannot pair, with times descending whichever way you read it.
      Reversing it does not close the pairs either, so the author's intent is
      not recoverable. Replaced with a plain 1 -> 0 decay, which is what a muzzle
      flash alpha does and what the surviving numbers trend towards. The
      alternative is leaving a curve the engine rejects outright, which animates
      nothing. If ASB ever fixes this the patch will fail the build and you can
      simply delete it.
    replace:
      - from: "1.000 0.706 0.564 0.150 0.000"
        to: "0.000 1.000 1.000 0.000"
        count: 1

  # --- Undefined @ variables -------------------------------------------------
  # The plasma_thrower muzzle entities scale by @plasmasmallplasmuzzle and
  # siblings, which ASB never defines anywhere -- so the token is malformed and
  # the entity gets no scale. The parallel plasma_accelerator entities in the
  # SAME FILE use @smallplasmuzzle / @mediumplasmuzzle / @largeplasmuzzle, which
  # ARE defined (1.3 / 3.4 / 4.5). The names are transposed, not missing.
  - path: gfx/models/combat_items/_ballistics_entities_ap.asset
    source: ASB Ironman
    why: >-
      @plasmasmallplasmuzzle / @plasmamedium... / @plasmalarge... are never
      defined; the intended variables are @smallplasmuzzle / @mediumplasmuzzle /
      @largeplasmuzzle, defined at the top of this same file and already used by
      the parallel plasma_accelerator entities. No values invented.
    replace:
      - from: "scale = @plasmasmallplasmuzzle"
        to: "scale = @smallplasmuzzle"
        count: 1
      - from: "scale = @plasmamediumplasmuzzle"
        to: "scale = @mediumplasmuzzle"
        count: 1
      - from: "scale = @plasmalargeplasmuzzle"
        to: "scale = @largeplasmuzzle"
        count: 1

  # --- ASB typo: a comment banner missing its leading '#' --------------------
  - path: gfx/particles/_ap_lasers_particles_alt.gfx
    source: ASB Ironman
    why: >-
      Line 8 reads FIGHTERS######... -- a section banner whose leading '#' was
      dropped, so "FIGHTERS" parses as a token and takes the rest of the file
      with it. Restoring the '#' makes the whole line a comment again.
    replace:
      - from: "\nFIGHTERS####"
        to: "\n#FIGHTERS####"
        count: 1

  # --- 3.x scalar where 4.4 wants a range ------------------------------------
  - path: sound/ASB_soundeffects.asset
    source: ASB Ironman
    why: >-
      4.4 wants delay_random_offset and playbackrate_random_offset as a { min
      max } range; ASB gives a bare 0.0. The same file already writes
      volume_random_offset = { 0.0 0.15 } correctly, so this is an internal
      inconsistency rather than a deliberate 3.x form. { 0.0 0.0 } preserves
      the intended meaning exactly -- no random offset.
    replace:
      - from: "delay_random_offset = 0.0"
        to: "delay_random_offset = { 0.0 0.0 }"
        count: 2
      - from: "playbackrate_random_offset = 0.0"
        to: "playbackrate_random_offset = { 0.0 0.0 }"
        count: 2

  # --- Key valid only on a different projectile type -------------------------
  - path: gfx/projectiles/ap_missiles.txt
    source: ASB Ironman
    why: >-
      max_duration is valid on projectile_gfx_ballistic in vanilla 4.4 -- 79
      uses across 10 files -- and on no other projectile type. ASB puts it on a
      projectile_gfx_missile block, where 4.4 rejects it. Removed; @maxduration
      is left defined and simply unused, since ASB may reference it again.
    replace:
      - from: "\tmax_duration = @maxduration\r\n"
        to: ""
        count: 1

  # --- The five-value "grow" curve: 18 sites, 17 files, one mistake ----------
  # Every one of them reads
  #
  #     curve={ 0.100 0.100 0.209 0.400 1.000 }
  #
  # inside an animation named "grow" or "grow2". A curve is a flat list of
  # (time, value) pairs, so this is (0.100, 0.100), (0.209, 0.400), and then a
  # timestamp of 1.000 whose VALUE WAS NEVER TYPED. 4.4 rejects the whole curve
  # -- `invalid curve. Expected pairs of timestamps and values`, 18 records in
  # the 2026-08-02 log -- and the muzzle flash it drives does not scale at all.
  #
  # Unlike the odd-length curves further up, this one needs no judgement. ASB's
  # own well-formed `grow` curves are unanimous about where a grow ends: 57 read
  # `0.000 0.242 1.000 1.000`, 33 read `0.000 0.000 1.000 1.000`, and the
  # three-pair form is `0.000 0.000 0.412 0.891 1.000 1.000`. Restoring the
  # missing trailing 1.000 ADDS the absent number instead of dropping a present
  # one, and produces exactly that shape.

  - path: gfx/particles/combat/adv_kinetic_artillery_muzzle.asset
    source: ASB Ironman
    why: >-
      Five-value "grow" curve -- see the banner above. The missing final value
      is restored as 1.000; no existing number is changed or dropped.
    replace:
      - from: "0.100 0.100 0.209 0.400 1.000 "
        to: "0.100 0.100 0.209 0.400 1.000 1.000 "
        count: 1

