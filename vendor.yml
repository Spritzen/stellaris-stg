      # leaving the .dds behind. Same reference-edge blindness as the 08-02 and
      # 08-03 rounds above, one file type further down.
      #
      # shared_assets/ is the bulk: 98 of the 132 recoverable names, and it is
      # STNH's cross-culture texture library — 251 .dds and one .ini, with no
      # .gfx, .asset or .mesh in it, so it declares nothing and cannot drag any
      # further directory back in. That is why it is taken whole.
      - gfx/models/ships/shared_assets
      # The other 34 sit beside art in cultures the harvest no longer takes, so
      # they are named file by file rather than by directory — a directory here
      # would pull the culture's meshes back in behind it, which is the prune
      # decision 18 forced. Derived from the log, then resolved against
      # .source/: every one had exactly one home, so there is no ambiguity.
      - gfx/models/ships/borg_blue_01/blue.dds
      - gfx/models/ships/cardassian_01/pylongrid.dds
      - gfx/models/ships/cardassian_01/starbase/cbase1_diffuse.dds
      - gfx/models/ships/cardassian_01/starbase/cbase1_normal.dds
      - gfx/models/ships/confederation/tos_coe_flag_wide.dds
      - gfx/models/ships/dominion_01/dominion_hull_turquoise_diffuse.dds
      - gfx/models/ships/ferengi_01/rays.dds
      - gfx/models/ships/klingon_02/klingon_02_all_diffuse.dds
      - gfx/models/ships/klingon_02/klingon_02_all_normal.dds
      - gfx/models/ships/klingon_02/klingon_02_all_specular.dds
      - gfx/models/ships/klingon_houses/Starbase/station_hull_1_diffuse.dds
      - gfx/models/ships/klingon_houses/Starbase/station_hull_1_normal.dds
      - gfx/models/ships/klingon_houses/Starbase/station_hull_2_diffuse.dds
      - gfx/models/ships/klingon_houses/Starbase/station_hull_2_normal.dds
      - gfx/models/ships/klingon_houses/Starbase/station_hull_3_diffuse.dds
      - gfx/models/ships/klingon_houses/Starbase/station_hull_3_normal.dds
      - gfx/models/ships/romulan/starbase/starbase_01_diffuse.dds
      - gfx/models/ships/romulan/starbase/starbase_01_normal.dds
      - gfx/models/ships/romulan/starbase/starbase_02_diffuse.dds
      - gfx/models/ships/romulan/starbase/starbase_02_normal.dds
      - gfx/models/ships/romulan_04/romulan_hull_dark_green_diffuse.dds
      - gfx/models/ships/romulan_04/romulan_hull_grey_diffuse.dds
      - gfx/models/ships/romulan_04/romulan_hull_light_green_diffuse.dds
      - gfx/models/ships/terran/Decal_TELogo_TOS.dds
      - gfx/models/ships/terran/centaur/centaur_5_diffuse.dds
      - gfx/models/ships/terran/shangri_la/shangri_la_diffuse_02_mu.dds
      - gfx/models/ships/terran/transparent_diffuse.dds
      - gfx/models/ships/undine_01/undine_01_corvette_coreA_diffuse.dds
      - gfx/models/ships/undine_01/undine_01_corvette_coreA_normal.dds
      - gfx/models/ships/undine_01/undine_01_corvette_coreA_specular.dds
      - gfx/models/ships/vulcan_01/hull_vulcan.dds
      - gfx/models/ships/vulcan_01/vulcan_ring_hull_diffuse.dds
      # Five more the LOG could not name, because they light the Borg unicomplex
      # ambience and nobody in that run flew to one. Found by sweeping the rule
      # instead — check_texture_basenames asks every .gfx in the tree, not the
      # ones a session happened to render. other/unimatrix_ambience.gfx is kept
      # and names all five; each lives in its own borg_<colour>_01/ directory.
      - gfx/models/ships/borg_blue_01/borg_blue_adaptor_01_lights.dds
      - gfx/models/ships/borg_orange_01/borg_orange_adaptor_01_lights.dds
      - gfx/models/ships/borg_purple_01/borg_purple_adaptor_01_lights.dds
      - gfx/models/ships/borg_red_01/borg_red_adaptor_01_lights.dds
      - gfx/models/ships/borg_yellow_01/borg_yellow_adaptor_01_lights.dds
