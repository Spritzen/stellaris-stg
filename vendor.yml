  # ── Star Trek: New Civilisations shipsets (Walshicus) ──────────────────────
  # 22 standalone shipsets, each one culture. They replace STNH as the ship art
  # for every species that has one, because they are built on VANILLA's chassis
  # rather than STNH's: each declares all 44 of vanilla's section entities under
  # vanilla's own names (`<culture>_battleship_bow_XL1_entity` and the rest),
  # with the locators vanilla's section templates mount on. Measured against the
  # engine's own requirement: 22 × 44 sections, 0 missing locators — the only
  # hits are 5 on `<culture>_titan_entity`, which vanilla's own
  # mammalian_01_titan_entity fails identically because titan guns live on the
  # bow/mid/stern parts, not the frame.
  #
  # That is what retires tools/gen_shipsets.py for these nine cultures: no
  # generated sections, no `clone` chain, no load-order hazard.
  # See .docs/decisions/18-walshicus-shipsets-replace-stnh-hulls.md.
  #
  # AFTER STNH on purpose. Paths are disjoint in practice (each set owns its own
  # gfx/models/ships/<culture>/), but where they are not, the newer art wins.
  #
  # Only two prefixes are taken from each, and the omissions are deliberate:
  #   * `interface/` — every set ships a 3,391-line interface/credits.txt that
  #     SHADOWS vanilla's 10,945-line one. Decision 08's failure mode exactly.
  #   * `common/species_classes/` — each declares its own (STARFLEET_TNG,
  #     KLINGON …). STG owns that namespace; the binding is one
  #     `graphical_culture =` line in src/, per decision 10.
  #   * `flags/` is taken, but ADDITIVELY (2026-08-08). All 22 write
  #     flags/trek/, where 42 of their 81 .dds collide with STNH's 425 at a
  #     different size — 256x256 against STNH's 128x128 — and STNH stays the
  #     agreed flag source (decision 18). `additive_only: [flags]` gives STNH
  #     every contested path and takes only the 13 basenames it has not got:
  #     Borg, dominion, elachi, federation_01..07, krenim_old, lukari, malon,
  #     39 files with their map/ and small/ variants. Scoped to `flags` and not
  #     the source, because gfx/ must still beat STNH — decision 18 again.
  #     The Bolian Union and 22 of the 79 minor powers are still on a fallback
  #     icon: no shipset ships those either. See decision 49.
  #   * `localisation/` — carries only the species-class name we don't take and
  #     FLAG_CATEGORY_trek, which STNH already provides.
  - id: "2990277402"
    name: Betazoid Shipset
    # Anchor: every set in this tier has the identical layout, so the include
    # list is written once here and referenced by the other 21.
    include: &stnc_shipset_include
      - gfx
      - common/graphical_culture
      - flags/trek
    additive_only: &stnc_shipset_additive
      - flags

