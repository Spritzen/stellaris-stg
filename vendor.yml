    source: Starbase Extended 3.0
    why: >-
      `missile_battery` declares `potential` twice; 4.4 keeps one and drops the other.
      The second block's conditions are folded into the first and the
      duplicate removed, so both the gate and the build-count cap apply.
      Lines moved, not rewritten.
    replace:
      - from: "\tpotential = {\r\n\t\texists = owner\r\n\t\towner = { has_technology = tech_torpedoes_1 }\r\n\t\tis_normal_starbase = yes\r\n\t}\r\n"
