# Star Trek Galaxies — vendoring manifest
#
# The source of truth for everything vendored. `make vendor` replays this file
# to produce the mod tree; nothing under the generated tree is ever hand-edited.
# See .docs/architecture/vendored-merge.md for the design,
# .docs/architecture/harvest-order.md for the order sources apply in, and
# .docs/architecture/conflict-register.md for how each contested path was
# settled — the reasoning behind every choice below.
#
# Rules this file encodes:
#   * Sources apply in listed order. Later sources overwrite earlier ones on
#     identical paths — a load order resolved at build time, so we can see it.
#   * `src/` is applied after everything here and always wins. It is not a
#     source; tools/vendor.py overlays it unconditionally.
#   * Root-level files in a source are NEVER vendored (descriptor.mod,
#     thumbnails, licences, changelogs — and, while Kammarheit was still in the
#     harvest, its dead songs.asset, which referenced .ogg files the mod did not
#     ship). Only directories are harvested.
#
# Fields per source:
#   id             Steam Workshop ID; the directory under source_root.
#   name           Human name, for provenance.md and log output.
#   zip            Source ships as an archive; unpack it and treat the archive
#                  root as the mod root.
#   include        If present, take ONLY these path prefixes.
#   exclude        Glob patterns dropped from this source.
#   additive_only  `yes` — skip any path an earlier source already claims, for
#                  the whole source (STNH; the rule is .docs/architecture/stnh-art.md). A LIST of
#                  path prefixes scopes it, for a source that must beat an
#                  earlier one somewhere and lose to it elsewhere — the
#                  shipsets' `flags`, where STNH stays the flag source.

version: 1

# Where `make vendor` reads the source mods FROM: our own pinned snapshot, not
# Steam's directory. `/workshop` changes whenever a mod author publishes and
# vanishes if we unsubscribe, so the build must not depend on it directly.
# `make sources-sync` is the only thing that copies one to the other, and
# `make sources-status` / `make sources-diff` show the gap first.
# See tools/sources.py and .docs/decisions/09-source-snapshot.md.
source_root: .source
workshop_root: /workshop

# Dropped from every source. Editor and Explorer junk shipped by the Planetary
# Diversity family — 12 files, two of them contested. Nothing reads them.
# (.docs/architecture/conflict-register.md, "Explicit excludes")
#
# The extension list below is the clutter pass's junk tier
# (.docs/decisions/45-clutter-pass.md, phase 1). These are not a reachability
# question and `make clutter` is deliberately not asked to answer one: they are
# authoring by-products that name no Stellaris format at all. Vanilla ships the
# same class itself — 99 `.editordata`, 6 `.bak`, 2 `.ods` — which is what
# makes it a category rather than a judgement about one mod.
global_excludes:
  - "**/desktop.ini"
  - "**/Thumbs.db"
  - "**/*.psd"
  - "**/*.bak"        # editor backups, incl. two `*.gfx.bak` — 3 files
  - "**/*.wip"        # UIOD's interface/wip/ work-in-progress .gui — 3
  - "**/*.wavorig"    # STNH's pre-conversion audio, beside its .wav — 2
  - "**/*.pdn"        # Paint.NET source art — 1
  - "**/*.dcm"        # STNH portrait-tool intermediates — 2
  # Source art left beside its export. Each of the three has a .dds twin at the
  # same path, and it is the .dds that every declaration names by path — 1, 7
  # and 19 references respectively, none to the .png. Shipped by all 22
  # Walshicus shipsets through their shared texture directory, so this is one
  # rule rather than 22 excludes.
  - "gfx/models/ships/stnc_shipset_shared/textures/*.png"
  # Nine non-English localisation trees, 235 files and 3.8 MB, plus the loose
  # per-language files at localisation/ root and in localisation/replace/.
  # Not unreachable — deliberate upstream content STG has no use for. STG is
  # personal and never published (.docs/planning/scope.md) and is played in English, so
  # every one of these is a file the engine parses and then never reads a key
  # from. This is a taste call in the shape of decision 11's, taken explicitly
  # rather than swept: see .docs/decisions/45-clutter-pass.md, phase 3.
  #
  # Both forms are needed. The directory glob catches the four files whose
  # names do not carry the tag (`pd_uniques_l_spanish..yml`,
  # `..._l_vanilla_overwrites_french.yml`, one `_l_chinese` inside
  # simp_chinese/); the filename glob catches the 38 that live at
  # localisation/ root and under replace/, where no directory names a language.
  - "localisation/braz_por/**"
  - "localisation/french/**"
  - "localisation/german/**"
  - "localisation/japanese/**"
  - "localisation/korean/**"
  - "localisation/polish/**"
  - "localisation/russian/**"
  - "localisation/simp_chinese/**"
  - "localisation/spanish/**"
  - "**/*_l_braz_por.yml"
  - "**/*_l_french.yml"
  - "**/*_l_german.yml"
  - "**/*_l_japanese.yml"
  - "**/*_l_korean.yml"
  - "**/*_l_polish.yml"
  - "**/*_l_russian.yml"
  - "**/*_l_simp_chinese.yml"
  - "**/*_l_spanish.yml"

# Files the reachability closure proves nothing names, which it is nonetheless
# NOT allowed to remove. Every entry needs a correctness argument — why the
# engine reaches this file by a route `make clutter` cannot see — and never a
# cost estimate. An ack justified by "it's only load time" is what
# dangling_identifier_ack cost: 439 errors, 21.8% of a run's error.log, behind
# an estimate nobody revisited (decision 32). If the fix is cheap, take the fix.
clutter_keep: []

# Vendored files that shadow a vanilla file and drop a definition, where the
# drop has been checked and is fine. tools/validate.py's vanilla-regression
# check (decision 08) warns about every one of these otherwise. Anything NOT
# listed here is an unreviewed regression -- go and look at it.
vanilla_regression_ack:
  # Vanilla defines avian_hair_1 / molluscoid_hair_1 in several clothes files at
  # once; STNH's copies drop it, but the vanilla avian_* and molluscoid_*
  # clothes files still define it and we don't shadow those.
  - gfx/portraits/asset_selectors/humanoid_02_male_clothes_01.txt
  - gfx/portraits/asset_selectors/humanoid_03_male_clothes_01.txt
  - gfx/portraits/asset_selectors/humanoid_04_clothes_01.txt
  - gfx/portraits/asset_selectors/humanoid_05_female_clothes_01.txt
  - gfx/portraits/asset_selectors/humanoid_05_male_clothes_01.txt
  # STNH comments out every vanilla song and main theme, replacing the Stellaris
  # soundtrack with its own Trek one. That is on-theme and deliberate, and the
  # Trek tracks plus Extended Soundtrack still play. (Kammarheit and Apocryphos
  # were also playing when this was written; both dropped 2026-08-02, below.)
  # Restoring the vanilla songs means an src/ copy of these three files.
  - music/songs.txt
  - music/maintheme2.txt
  - music/maintheme3.txt

# ── Cross-reference check acknowledgements ───────────────────────────────────
# Three lists, all read by tools/validate.py, all the same idea as
# vanilla_regression_ack above: a known and understood case that would
# otherwise keep a check permanently red. A check that cannot be silenced for a
# case someone has actually looked at gets ignored wholesale, which is worse
# than not having the check. Anything NOT listed is a new finding.

# Names the vendored STNH art references that nothing defines.
#
# dangling_identifier_ack: GONE, and deliberately empty rather than deleted.
#
# It held 33 species classes -- every key STNH's master clothes selectors gate a
# wardrobe branch on and STG did not declare. The reasoning for acking them was
# that declaring empty classes "would create species that appear nowhere and
# have to be rewritten in Phase 2", with the cost scored as load-time only.
#
# The 2026-08-07 live run priced that properly: 439 records, 22% of error.log,
# and the cost is NOT confined to load time -- a species whose class does not
# resolve falls through to the selector's `default`, which is human civilian
# clothing. The ack made a silent defect permanently silent, which is what
# .docs/validation/acks.md warns an ack does.
#
# All 34 are now declared as stubs in src/common/species_classes/, four of them
# by correcting a near miss of our own (DELT->DEL, ELAU->ELA, MONE->MON,
# PARA->PAR -- decision 20 again). The list stays here, empty, because the next
# reader needs to find this note rather than wonder why there is no ack.
# See .docs/decisions/32-declare-stub-species-classes.md.
dangling_identifier_ack: []

# Prescripted empires whose species class is named by no line of the class-gated
# clothes selector their portraits use, and where that is CORRECT.
# See .docs/decisions/20-minor-power-species-class-keys.md and
# check_portrait_clothes_selectors in tools/validate.py.
#
# All four wear human art. The master selector's `default` IS human civilian
# clothing, so falling through to it produces exactly the right result and
# declaring a class for them would change nothing on screen.
#
# NOT acked, deliberately, and still reported every run: KRI, MONE, PARA, TNG
# and VALT. Those five have their own art and no clothing to go with it — a
# Phase 2 content gap, not a settled exception. Do not silence them here.
portrait_clothes_ack:
  - stg_terran_empire            # human art (mirror universe)
  - stg_minor_confederation_earth  # human art
  # stg_minor_deltan_union and stg_minor_elaurian_auditorium were removed
  # 2026-08-07: both were acked as "generic human_02 art" while their real
  # defect was the decision-20 misspelling, and decision 32's DELT→DEL /
  # ELAU→ELA rename gave each people the clothing that was already vendored.
  # The ack outlived the fix and would have hidden a regression.

# Shader effects a vendored mesh names that no .shader file declares.
# Engine built-ins are allowed automatically (validate.py takes them from what
# vanilla itself references but never declares — "Collision" and friends), so a
# name here is a genuine dangling reference in a source mod.
dangling_shader_ack:
  # A typo in STNH's own gfx/models/ships/borg_01/borg_01_all_ships.gfx:96.
  # Vanilla declares PdxMeshAlphaAdditiveAnimateUVNoDissolve; there is no "123"
  # variant in vanilla 4.4 OR in STNH's own gfx/FX/pdxmesh.shader, so this has
  # never resolved for anyone. One material on one Borg mesh. Not ours to fix,
  # and not worth an src/ override of a 10 MB .gfx to correct one string.
  - PdxMeshAlphaAdditiveAnimateUVNoDissolve123

# Meshes and particles a vendored file names that NOTHING declares -- not the
# merged tree, not vanilla, not the source mod's own .source/ snapshot. Read by
# tools/validate.py's check_dangling_art_references.
#
# Unlike the three lists above these are not ours to fix and not fixable by
# vendoring differently: the declaration does not exist anywhere to vendor. Each
# one is a source mod referencing art it never shipped, which is a bug in that
# mod. The cost is one error.log record per name, at load, and the effect it
# drives does not play.
dangling_art_ack:
  # ── FIVE ENTRIES REMOVED 2026-08-07, because they had stopped suppressing
  # anything. dominion_01_base_mesh, cardassian_01_orbital_station_mesh,
  # voth_01_sovereign_coreA_mesh, talaxian_particle_fountain_mesh and
  # klingon_shipyard_muesum_mesh were acked when decision 18's prune stranded
  # them; decision 24 then REDECLARED all five in
  # src/gfx/models/ships/stg_stnh_restored_station_meshes.gfx and nobody
  # deleted the ack. Verified by removing each entry and re-running the check:
  # the findings are identical either way. This is the failure mode .docs/validation/acks.md
  # names — an ack entry stays silent forever, including after its fix lands.
  #
  # Starbase Extended references a toxoid ship-light particle in its toxoid
  # starbase entities (51 sites in _starbase_entities_SBX_3_0_toxoid.asset).
  # There is no toxoid_01_ship_light_effect in vanilla 4.4, in SBX's own
  # snapshot, or in any other source -- SBX appears to have copied the humanoid
  # file and renamed the prefix. The starbase draws; only its window lights do
  # not. Same for the two ion-core effects, one site each.
  - toxoid_01_ship_light_effect
  - toxoid_01_ion_core_effect
  - aquatic_01_ion_core_effect
  # ASB Ironman names muzzle-bullet particles for four weapon families it does
  # not ship a definition for. Its own gfx/particles/ has the corresponding
  # _muzzle assets but no *_muzzle_bullets_effect. One reference each.
  - auto_cannons_small_muzzle_bullets_effect
  - auto_cannons_medium_muzzle_bullets_effect
  - auto_cannons_large_muzzle_bullets_effect
  - ripper_cannons_small_muzzle_bullets_effect
  - ripper_cannons_medium_muzzle_bullets_effect
  - ripper_cannons_large_muzzle_bullets_effect
  - stormfire_cannons_small_muzzle_bullets_effect
  - stormfire_cannons_medium_muzzle_bullets_effect
  - stormfire_cannons_large_muzzle_bullets_effect
  - nanite_cannons_small_muzzle_bullets_effect
  - nanite_cannons_medium_muzzle_bullets_effect
  - nanite_cannons_large_muzzle_bullets_effect
  # ASB's arc emitter names a flash and a trail particle it never declares.
  - arc_emitter_flash_particle
  - arc_emitter_trail_particle
  # STNH declares fluidic_rift_effect_particle only in its copy of
  # gfx/particles/_projectiles_particles.gfx, which is EXCLUDED above because it
  # is a 3.12-era shadow of a vanilla 4.4 file. One reference; taking the whole
  # file back to fix it would trade one record for decision 08's failure mode.
  - fluidic_rift_effect_particle

# Art files a vendored .gfx/.asset names by PATH that are not on disk. Listed =
# looked at and accepted. check_gfx_file_refs reports everything else; its
# docstring in tools/validate.py says what it was built to catch.
gfx_file_ref_ack:
  # ASB Ironman's neutron-torpedo windup names gfx/particles/Cloud_3.dds at 14
  # sites. The file is in no source and in no vanilla 4.4 install -- ASB ships
  # Cloud_1/2/4 and appears to have dropped 3. Two records in the live log
  # (texturehandler.cpp:66 and :350), long-standing group C, and the torpedo
  # itself draws; only its cloud puff does not.
  - gfx/particles/Cloud_3.dds

# Bare texture filenames named by vendored art that exist in no source and in no
# vanilla install — check_texture_basenames. Listed = looked for in .source/ and
# in /stellaris and genuinely absent, so no include: can fix them. These are
# upstream bugs in someone else's art, which decision 12 says we repair rather
# than drop the mod for — but a texture nobody ships cannot be repaired from
# here, and the cost is one untextured material, not a missing mesh.
texture_basename_ack:
  # Real Space – System Scale's copy of the planetary entities asset names six
  # Infernals ring-world textures. Vanilla 4.4's own _planetary_entities.asset
  # names none of them and vanilla ships no file of that name, so these are not
  # a 4.4 regression the way decision 08's dropped entities were — System Scale
  # invented references to art it does not carry.
  - infernal_ring_world_habitat_diffuse.dds
  - infernal_ring_world_habitat_normal.dds
  - infernal_ring_world_habitat_specular.dds
  - infernal_ring_world_tech_diffuse.dds
  - infernal_ring_world_tech_normal.dds
  - infernal_ring_world_tech_specular.dds
  # Two STNH ones, same shape: named by art we keep, shipped by nobody. The USS
  # Ross' outer deflector and one Borg transparency. Both meshes draw; one
  # material on each is untextured.
  - ross_deflector_out_diffuse.dds
  - transp_green.dds

# Defines set by more than one source. Listed = the last-wins outcome has been
# checked and is the one we want. This is the check that finds a key two mods
# contest through differently-named files, which .docs/architecture/conflict-register.md's path register
# structurally cannot see.
# Keys contested across mod families, reviewed and accepted. Accepts a bare
# key, `<database>/<key>`, or `<database>/*` for a whole database.
key_conflict_ack:
  # on_actions APPEND, they do not replace. Every mod that wants something to
  # happen at game start adds its own on_game_start block and all of them fire
  # -- that is the entire design of the database, and ten sources contesting it
  # here is ten mods working correctly. Reporting it would train us to ignore
  # the check.
  - on_actions/*
  # common/random_names/base pools APPEND across differently-named files, so a
  # pool smaller than vanilla's adds to it rather than replacing it. Settled
  # 2026-08-07 from the sources' own layouts: Real Space ships BOTH
  # 00_random_names.txt (1,569 star names) and a 15-name patron file with zero
  # overlap, which only makes sense if the second adds to the first; YAGEM's 60
  # asteroid prefixes likewise share none of the 136 already there.
  # See .docs/decisions/44-random-names-pools-append.md.
  - random_names/base/*

defines_conflict_ack:
  # The Real Space family layers on purpose, and its submods must beat the base
  # — the same reasoning that puts System Scale after Real Space in the harvest
  # order. `systemscale_` and `shipsinscaling_` both sort after `realspace_`,
  # so the in-game outcome matches the intended one.
  - NCamera.SYSTEM_FAR_PLANE_DISTANCE_BASE
  - NGraphics.SHIP_RANDOM_HEIGHT_OFFSET
  # UIOD - Extended Topbar overriding its own base mod, as designed. Its file
  # sorts after UIOD's by name, matching the harvest order.
  - NInterface.NOTIFICATION_MESSAGE_XPOS
  #
  # ── Cinematic Camera beating Real Space - System Scale, chosen 2026-08-07 ──
  # Restoring Cinematic Camera (see its entry above) IS choosing its camera over
  # System Scale's: the mod is nothing but these keys, `zzzzz_` sorts last, so
  # it takes all 17. That is not a defect to fix, it is what the mod does, and
  # there is no narrower version of it — patching out the contested keys leaves
  # three vanilla-owned scalars and nothing else.
  #
  # ACKED AS A GROUP, WHICH IS THE WEAKER KIND OF ACK, and it is worth knowing
  # why it is acceptable here: normally a content comparison beats an ack
  # because it starts firing again when the two values diverge (decision 29).
  # These are acked precisely BECAUSE they differ and we want the newer one to
  # win, so divergence is the intended state and there is nothing for a
  # comparison to catch. If Cinematic Camera is ever dropped again, delete this
  # block with it — left behind, it would silence a real conflict with whatever
  # sets these next.
  - NCamera.ENTER_SYSTEM_ZOOM_STEP
  - NCamera.FOCUSED_MAX_PITCH
  - NCamera.FOCUSED_MIN_PITCH
  - NCamera.FOCUSED_MIN_ZOOM_BASE
  - NCamera.FOCUSED_MIN_ZOOM_MULT
  - NCamera.FOCUSED_PLANET_MIN_ZOOM_MULT
  - NCamera.FOCUS_START_ZOOM_STEP
  - NCamera.FOV
  - NCamera.GALAXY_SHOW_FLEETS_ZOOM
  - NCamera.LEAVE_SYSTEM_ZOOM_STEP
  - NCamera.MOUSE_MOVEMENT_TO_START_ROTATION_SQ
  - NCamera.ROTATION_RADIANS_PER_MOUSE_UNIT
  - NCamera.SYSTEM_MAX_PITCH
  - NCamera.SYSTEM_MIN_PITCH
  - NCamera.SYSTEM_SLIDE_RADIUS_FACTOR
  - NCamera.ZOOM_STEPS_GALAXY
  - NCamera.ZOOM_STEPS_SYSTEM_PERCENTAGES
  #
  # ── Real Space - System Scale's 8-entry planet scale ramp, kept 2026-08-07 ──
  # Silences BOTH array-length checks for this key: the engine-fixed-length one
  # (8 against the un-scriptable NCamera.ZOOM_STEPS_SYSTEM's 7) and the
  # coherence one (8 against Cinematic Camera's 13 percentages).
  #
  # The engine logs `PLANET_SCALE_SYSTEM does not match in size with
  # ZOOM_STEPS_SYSTEM` once per run, outside the startup window. The 2026-08-07
  # visual test says the scaling WORKS ANYWAY: planets rescale across the zoom
  # steps at System Scale's sizes. Vanilla's ramp is 3-4.5x smaller through the
  # middle of the range, so a fallback to it would be unmistakable in a system
  # System Scale has enlarged, and it is not what is on screen.
  #
  # NOT a cost estimate -- the correctness question was answered in game, which
  # is the distinction .docs/validation/acks.md draws between an ack that holds and one that
  # rots. DELETE THIS ENTRY IF SYSTEM SCALE GOES, or if its ramp changes: the
  # argument is about these eight values, not about the key.
  # See .docs/decisions/43-planet-scale-system-length.md.
  - NGraphics.PLANET_SCALE_SYSTEM
  #
  # NShip.FLEET_BASE_FORMATION_SCALE and NInterface.NOTIFICATION_MESSAGE_YPOS
  # WERE HERE AND ARE DELIBERATELY GONE (2026-08-03). Both are set by two
  # sources to the SAME value — 0.6 and 0 — so neither was ever a conflict, and
  # check_defines_conflicts now compares values instead of counting setters
  # (decision 29). Removing them is the safer state, not the laxer one: an ack
  # would go on saying nothing if a source update made the two values diverge,
  # where now the check simply starts firing again.

# Order-sensitive databases fed by more than one source, reviewed and accepted.
# These five carry meaning in the ORDER their entries are declared across the
# whole directory, so two sources contributing files interleave into an order
# neither chose (decision 29). Listed by directory, e.g. `common/ethics`.
order_sensitive_ack:
  # Looked at 2026-08-08, which is what this check asks for, and the interleaving
  # it warns about does not happen here. Sorted, the directory reads: vanilla's
  # seven 00_* files, then PD - Unique Worlds' one, then Starbase Extended's two
  # in their own order. Every source's entries stay CONTIGUOUS and each keeps its
  # internal order — the merged sequence is the harvest order, not a shuffle.
  #
  # What order does in this database is the construction list: modules group by
  # `category` (a bare loc key with no declaring database) and list in
  # declaration order within the group. PD contributes 3 waystation_* modules,
  # all sm_utility_cat; SBX contributes 24, all sm_defense/economy/naval_support/
  # research_cat. NO CATEGORY IS SHARED, so no list exists in which one source's
  # entries are ordered against the other's.
  #
  # Not this check's business, recorded so the next reader does not re-derive it:
  # SBX also redefines seven vanilla keys (gun_battery, missile_battery,
  # hangar_bay, detection_array and three orbital_ring_*). starbase_modules is
  # LIOS, sbx_* sorts after 00_*, so SBX wins — which is what SBX intends
  # (decision 39). That is check_key_conflicts' question, not this one's.
  # See .docs/decisions/56-starbase-modules-order.md.
  - common/starbase_modules

# Entity names declared twice with bodies that differ, reviewed and accepted.
# Read by tools/validate.py's check_duplicate_entities. Keyed by entity name.
#
# THE LIST WAS MISSING UNTIL 2026-08-07 while the check that reads it shipped, so
# its 13 findings had no triage path at all. All 13 were triaged on 2026-08-08:
# six suppress themselves by content (one body is vanilla's own and the other is
# a live 4.x mod's deliberate override of it), six are repaired by the renames in
# `patches:`, and this is the one that is genuinely inert.
# See .docs/decisions/53-duplicate-entity-triage.md.
duplicate_entity_ack:
  # PD - More Arcologies' _pd_gestalt_arcologies.asset and PD's own
  # _pd_ma_hive_arcologies.asset both declare it, pointing at
  # pd_machine_planet_shield_effect_mesh and pd_ma_machine_planet_shield_effect_mesh
  # respectively. THE WINNER CANNOT CHANGE WHAT RENDERS: both meshes name the same
  # planet_shield_effect.mesh with the same PdxMeshAlphaAdditiveAnimateUV shader,
  # and their two diffuse textures — pd_machine_planet_shield.dds and
  # pd_ma_machine_planet_shield.dds — are byte-identical (same sha256, 2,097,280
  # bytes each). Both files also attach it only from their own arcology entities.
  # A correctness argument, not a cost estimate: there is no visible difference to
  # decide. Resolving mesh names to their .gfx bodies to prove that automatically
  # is the indirection decision 35 warns about, and would buy one finding.
  - pd_machine_planet_shield_effect_entity

# Texture basenames carried by two folders with different content, reviewed and
# accepted. Read by tools/validate.py's check_duplicate_textures. Keyed by
# DIRECTORY, not basename: acking one side silences every pair it appears in.
#
# The Walshicus shared-texture library is acked on .docs/architecture/conflict-register.md's review, which
# priced these 143 records a run and called last-wins correct — the 22 Walshicus
# shipsets are one author's family sharing a `stnc_shipset_shared/` vocabulary,
# and where it meets STNH's `shared_assets/` the two files are variants of one
# texture under one name, not unrelated art colliding.
#
# What the check adds on top of that review, and why it is not redundant with
# it: the 2026-08-07 measurement says ALL 142 pairs differ in content, so
# "last-wins is correct" rests on the two variants looking alike, which no
# static check can confirm and only eyes on a live run can. It is a taste call
# that has been made, not a correctness argument that has been proved. Left
# acked rather than reopened; if Federation hulls ever look wrong across two
# shipsets, this is the first place to look.
#
# The federation/ vs starfleet_tng/ pairs are acked BY MEASUREMENT, 2026-08-08,
# which is a stronger footing than the library above stands on: decoded and
# compared pixel by pixel, all five colliding files are the SAME ARTWORK on both
# sides, differing only in compression. Mean absolute difference at 64×64, against
# a control of 23–27% for two textures that genuinely differ:
#
#   starfleet_olympic_diffuse.dds          0.001%   1024² raw  vs 1024² DXT1
#   starfleet_olympic_specular.dds         0.000%   1024² raw  vs 1024² DXT5
#   starfleet_galaxy_hull_01_specular.dds  0.000%   1024² raw  vs 1024² DXT5
#   ESD-Lights1_normal.dds                 0.044%    256×16    both
#   starfleet_olympic_normal.dds           1.164%   1024² raw  vs 2048² DXT5
#
# Both authors cut these from the same source art, and the filenames say so —
# each names the ship class it belongs to on both sides. So whichever copy the
# engine keeps, both shipsets draw the same picture; the only real consequence is
# that if STNH's 1024² Olympic normal map wins, the Walshicus cruiser's is half
# resolution. A sharpness difference, not a ship wearing the wrong skin.
#
# Acked on the STNH side only, so a NEW collision against the live Walshicus
# Federation shipset still reports.
# See .docs/decisions/54-federation-texture-collisions.md.
duplicate_texture_ack:
  - gfx/models/ships/stnc_shipset_shared/textures
  - gfx/models/ships/federation/olympic
  - gfx/models/ships/federation/galaxy
  - gfx/models/ships/federation/starbase

