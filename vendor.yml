  - path: common/section_templates/!!!_sbx_3_0_starbase_sections.txt
    source: Starbase Extended 3.0
    why: >-
      SBX's CITADEL_STARBASE_SECTION replaces vanilla's (its `!!!_` prefix wins
      FIOS) and renumbers vanilla's oddly-named MEDIUM_GUN_010..013 to the
      conventional two-digit 10..12, one slot short. Vanilla's OWN biogenesis
      hatchery design still asks for 010..013, so four of its thirteen medium
      mounts did not exist -- `invalid component slot` x4 in the 2026-08-07 run.
      This renames SBX's 10/11/12 back to vanilla's 010/011/012 and adds the
      013 SBX never had, restoring vanilla's exact thirteen slot names.
      Nothing else in either tree references a citadel MEDIUM_GUN by name, and
      SBX's STRONGHOLD/HEADQUARTERS _XL sections (which already run to 16 and 20
      and are SBX's own) are deliberately untouched. Every slot in this section
      shares locatorname "medium_gun_01", so the added slot needs no new
