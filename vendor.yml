  # --- Saturn in Sol was declared twice, by two mods, with different art ------
  - path: gfx/models/planets/_pd_unihabitable_entities.asset
    source: Planetary Diversity
    why: >-
      `gas_giant_saturn_entity` was declared by this file AND by Real Space's
      rs_planetary_entities.asset, with bodies that differ: PD paints it with
      gas_giant_saturn_diffuse.dds at scale 1.2, Real Space with
      gas_giant_31_diffuse.dds at @gas_giant_scale (= 1). The engine keeps one
      and logs the other, and which one it keeps is recorded nowhere -- so this
      silently decided what Saturn looks like on every Sol start. 2026-08-07.

      REAL SPACE WINS, because it owns the name: all six solar_system_initializers
      that place this entity are Real Space's (sol, sol_solsector_small/large,
      federations, pre_ftl, unplugged), at size = 35 / has_ring = yes, and
      @gas_giant_scale is the variable keeping its other gas giants consistent.
      PD's 1.2 would have made Saturn 20% larger than the system built around it.

      RENAMED, NOT DELETED. PD's art stays in the tree under a name nothing
      places, so switching to it later is a one-line change rather than a
      re-harvest. Nothing dangles: PD's own events/pd_engine.txt still says
      `set_planet_entity = { entity = "gas_giant_saturn_entity" }`, which Real
      Space declares -- and that event gates on planet_size = 30 where Real
      Space's Sol builds Saturn at 35, so it is unlikely to fire here at all.

      See .docs/decisions/33-duplicate-entity-declarations.md.
    replace:
      - from: "\tname = \"gas_giant_saturn_entity\""
        to: "\tname = \"pd_gas_giant_saturn_entity\""
        count: 1

