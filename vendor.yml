# Planet/star class names in solar_system_initializers that resolve to nothing
# and have been reviewed. Read by tools/validate.py's check_initializer_classes.
#
# Ack sparingly: an unresolvable class is what hard-crashed the game on
# 2026-08-03 (decision 26), and the crash leaves nothing in error.log.
#
# These five are Real Space's own, in realspace_special_system_initializers.txt,
# and are dangling in Real Space's source too — its randomizer lists are all
# `rl_`-prefixed (rl_blue_stars, rl_red_giant_stars, rl_super_blue_stars), so
# these five look like the prefix being dropped by hand. Not ours to fix and
# demonstrably not fatal: they predate the crash and the mod loaded with them
# for two days. The cost is that those specific Real Space special systems fall
# back to a default star class rather than the intended one. Left as a source
# defect rather than patched, because nothing in STG depends on them.
#
