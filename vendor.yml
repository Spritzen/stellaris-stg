  # --- Real Space's start-of-game configuration menu ------------------------
  # STG always runs Real Space on its defaults, so the menu is a popup with
  # nothing to decide in it. realspace.204 fires on_game_start and sends every
  # human country realspace.206, the menu; every path out of it ends at
  # realspace.1000, which sets realspace_starting_settings_applied and fires
  # on_applying_rs_settings -- the on_action that actually builds the nebulae,
  # the globulae and the Sol-cluster civilisations. Pointing 204 straight at
  # 1000 skips the window and applies exactly the state a player would get by
  # opening it and clicking Close, because no option is preselected and none of
  # the setting flags is set until an option is chosen.
  #
  # The anchor is the `limit = { is_ai = no }` line, which occurs exactly once
  # in the file; `country_event = { id = realspace.206 }` occurs 45 times.
  # CRLF is Real Space's, not ours.
  - path: events/realspace_game_start.txt
    source: Real Space 4.0
    why: >-
      Real Space's start menu (realspace.204 -> realspace.206) is a popup on
      every new game offering settings STG never changes. Fire the apply event
      realspace.1000 directly instead, which is what closing the menu does.
    replace:
      - from: "\t\t\tlimit = { is_ai = no }\r\n\t\t\tcountry_event = { id = realspace.206 }\r\n"
        to: "\t\t\tlimit = { is_ai = no }\r\n\t\t\tcountry_event = { id = realspace.1000 }\r\n"
        count: 1

  # --- The empire designer dressed five Trek species as human civilians ------
  # A clothes selector's `game_setup` scope is what the empire designer draws,
  # and STNH's two master selectors give it one bare human-civilian default.
  # That is right for a per-species selector -- Cardassian, Bolian, Caitian and
  # the rest each have their own, whose single default IS that species' look --
  # and wrong for a selector 44 species share. FED, VUL, ADR, BAJ and TRI are
  # the five STG empires whose portraits point at the master pair, so all five
  # wore `civ_human_male_clothes_01.dds` in the picker while every other Trek
